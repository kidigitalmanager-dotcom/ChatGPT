function activeBounds(){let from=state.from,to=state.to;if(state.year!=='all'){from=from>`${state.year}-01-01`?from:`${state.year}-01-01`;to=to<`${state.year}-12-31`?to:`${state.year}-12-31`}return {from,to}}
function selectedMonths(){const {from,to}=activeBounds();return DATA.months.filter(m=>m.id>=from.slice(0,7)&&m.id<=to.slice(0,7)).map(m=>{const all=dailyRecords(m),days=all.filter(d=>d.iso>=from&&d.iso<=to);if(!days.length)return null;if(days.length===all.length)return m;const categories=Object.fromEntries(CATEGORIES.map(([k])=>[k,{gross:days.reduce((n,d)=>n+d.categories[k].gross,0),net:days.reduce((n,d)=>n+d.categories[k].net,0)}]));return {...m,categories,gross:days.reduce((n,d)=>n+d.gross,0),net:days.reduce((n,d)=>n+d.net,0),_days:days}}).filter(Boolean)}
function selectedMonth(id){return selectedMonths().find(m=>m.id===id)}
function sums(months){const cats=Object.fromEntries(CATEGORIES.map(([k])=>[k,{gross:0,net:0}]));let gross=0,net=0;for(const m of months){gross+=m.gross;net+=m.net;for(const [k] of CATEGORIES){cats[k].gross+=m.categories[k].gross;cats[k].net+=m.categories[k].net}}return {categories:cats,gross,net}}
function table(record,options={}){return `<table class="earnings-table" aria-label="${options.month?'Monthly':'All time'} earnings, gross and net">${options.month?'<thead><tr><th>Revenue source</th><th>Gross</th><th>Net</th></tr></thead>':''}<tbody>${CATEGORIES.map(([k,label])=>`<tr data-key="${k}" class="${!options.month&&state.hidden.has(k)?'is-muted':''}"><td><button class="category-button" data-action="${options.month?'transactions':'category'}" data-key="${k}" ${options.id?`data-id="${options.id}"`:''} ${!options.month?`aria-pressed="${!state.hidden.has(k)}"`:''}><span class="dot" style="--dot:var(--${k})"></span>${label}</button></td><td class="money">${money(record.categories[k].gross)}</td><td class="money">${money(record.categories[k].net)}</td></tr>`).join('')}</tbody><tfoot><tr><td>TOTAL</td><td><span class="total-label">GROSS</span><span class="money">${money(record.gross)}</span></td><td><span class="total-label">NET</span><span class="money">${money(record.net)}</span></td></tr></tfoot></table>`}
function chart(){
const records=selectedMonths().slice().reverse();
const partial=records.some(m=>m._days),suffix=partial?'':'/mo';
const max=Math.max(1,...records.flatMap(m=>CATEGORIES.map(([k])=>m.categories[k].gross)));
const x=i=>records.length<2?255:i/(records.length-1)*510;
const y=value=>137-value/max*120;
const points=values=>values.map((value,i)=>`${x(i).toFixed(2)},${y(value).toFixed(2)}`).join(' ');
const curves=CATEGORIES.slice().reverse().map(([k])=>`<polyline class="series" data-series="${k}" style="stroke:var(--${k});${state.hidden.has(k)?'display:none':''}" points="${points(records.map(m=>m.categories[k].gross))}"/>`).join('');
const labels=Array.from({length:Math.min(5,records.length)},(_,i)=>{const index=Math.round(i*(records.length-1)/Math.max(1,Math.min(5,records.length)-1));const m=records[index];return `<text class="axis-label" x="${x(index)}" y="158" text-anchor="${i===0?'start':i===Math.min(5,records.length)-1?'end':'middle'}">${m.label.replace(', ',' ').replace(/([A-Za-z]{3})[a-z]+/,'$1')}</text>`}).join('');
return `<div class="plot"><svg viewBox="0 0 510 160" preserveAspectRatio="none" role="img" aria-label="Monthly revenue by source. Blue: Subscriptions. Aqua: Tips. Pale peach: PPV Messages. Hover for monthly gross totals."><path class="grid" d="M0 1H510M0 47H510M0 92H510M0 137H510"/>${curves}${labels}</svg><button class="chart-hit" data-action="chart" aria-label="Inspect monthly gross revenue chart"></button><div class="plot-tooltip money" hidden></div></div>`}
function monthMarkup(m){const days=dailyRecords(m),period=`${dateLabel(days[0].iso)} – ${dateLabel(days.at(-1).iso)}`;return `<details class="month" data-month="${m.id}"><summary><span>${m.label}</span><strong class="money">${money(m.gross)}</strong>${icon('chevron','chevron')}</summary><div class="month-body"><div class="month-caption"><span>${period}</span><span>Gross revenue · USD</span></div>${table(m,{month:true,id:m.id})}<div class="detail-actions"><button class="text-button" data-action="daily" data-id="${m.id}" aria-expanded="false">Daily breakdown ${icon('chevron','chevron')}</button><button class="text-button" data-action="export-month" data-id="${m.id}">${icon('download')} CSV</button></div><div class="daily-container" hidden></div></div></details>`}
function dateLabel(s){return new Date(s+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'})}
function renderStatistics(){closeDateMenu(false);const records=selectedMonths(),total=sums(records),bounds=activeBounds(),periodTitle=state.year!=='all'?state.year:(DATE_PRESETS.find(p=>p[0]===state.rangePreset)?.[1]||'Selected period');$('#main-content').innerHTML=`<div class="section-title"><span>EARNING STATISTICS</span><span class="timezone">Date/Time shown in UTC time zone</span></div><section class="overview"><button class="overview-toggle" data-action="overview" aria-expanded="true" aria-controls="overview-body"><span>${periodTitle}</span><span class="amount"><span class="money">${money(total.gross)}</span></span>${icon('chevron','chevron')}</button><div id="overview-body">${chart()}<button class="date-pill" data-action="date" aria-haspopup="menu" aria-controls="date-menu" aria-expanded="false">${icon('calendar')}<span class="date-prefix">From</span><strong>${dateLabel(bounds.from)}</strong><span class="date-prefix">To</span><strong>${dateLabel(bounds.to)}</strong></button>${table(total)}</div></section><div class="months">${records.map(monthMarkup).join('')||'<p class="empty-state">No months in this period.</p>'}</div><div class="history-tools"><label>Year <select id="year-filter"><option value="all">All years</option>${[2026,2025,2024,2023,2022,2021].map(y=>`<option ${state.year==y?'selected':''}>${y}</option>`).join('')}</select></label><span>${records.length} months</span><button class="text-button" data-action="download-html">${icon('download')} HTML</button><button class="text-button" data-action="export">${icon('download')} Export CSV</button></div><p class="demo-footnote">Internal presentation demo. Fictional revenue scenario: $10,000 in the first month, $420,000 in the latest month, $3,642,057 total gross. Net revenue assumes a 20% platform fee. Subscriptions contribute $742,057, Tips $167,566.98, and chatting / PPV Messages $2,732,433.02. Tips vary between 3% and 8% of revenue in every period.</p>`}

function renderPage(){closeDateMenu(false);const route=location.hash.replace(/^#\/?/,'')||'statements/statistics';const isChat=route==='messages';if(!isChat)ChatDemo.stopSimulation?.();document.body.classList.toggle('chat-mode',isChat);$('#chat-root').hidden=!isChat;$('.workspace').hidden=isChat;fitCanvas();const inStatements=route.startsWith('statements/');$('#page-title').textContent=inStatements?'STATEMENTS':({home:'HOME',notifications:'NOTIFICATIONS',messages:'MESSAGES',collections:'COLLECTIONS',vault:'VAULT',queue:'QUEUE',statistics:'STATISTICS',profile:'PROFILE'}[route]||'STATEMENTS');$$('.statement-menu a').forEach(a=>{const active=a.hash==='#/'+route;a.classList.toggle('active',active);active?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});$$('a.rail-link').forEach(a=>{const active=a.hash==='#/'+route||(inStatements&&a.hash==='#/statements/statistics');a.classList.toggle('active',active);active?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});$('#scroller').scrollTop=0;

function downloadCsv(records,name){const header='Demo data (fictional breakdown);Month;Revenue source;Gross USD;Net USD;From UTC;To UTC\r\n';const rows=records.flatMap(m=>CATEGORIES.map(([k,l])=>`Internal presentation;${m.label};${l};${(m.categories[k].gross/100).toFixed(2)};${(m.categories[k].net/100).toFixed(2)};${dailyRecords(m)[0].iso};${dailyRecords(m).at(-1).iso}`));const blob=new Blob(['\uFEFF'+header+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV exported')}
function dailyRecords(m){if(m._days)return m._days;if(dailyCache.has(m.id))return dailyCache.get(m.id);const original=DATA.months.find(x=>x.id===m.id)||m,count=original.id==='2026-10'?20:new Date(Date.UTC(original.year,original.month,0)).getUTCDate(),first=original.id==='2021-10'?2:1,weights=Array.from({length:count-first+1},(_,i)=>1+((i*7+original.month*3)%11)/10);const split=n=>{const sum=weights.reduce((a,b)=>a+b,0),out=weights.map(w=>Math.floor(n*w/sum)),remain=n-out.reduce((a,b)=>a+b,0);for(let i=0;i<remain;i++)out[i%out.length]++;return out};const values=Object.fromEntries(CATEGORIES.map(([k])=>[k,{gross:split(original.categories[k].gross),net:split(original.categories[k].net)}]));const days=weights.map((_,i)=>{const day=i+first,categories=Object.fromEntries(CATEGORIES.map(([k])=>[k,{gross:values[k].gross[i],net:values[k].net[i]}]));return {day,iso:`${original.id}-${String(day).padStart(2,'0')}`,categories,gross:CATEGORIES.reduce((n,[k])=>n+categories[k].gross,0),net:CATEGORIES.reduce((n,[k])=>n+categories[k].net,0),subs:categories.subscriptions.net,ppv:categories.messages.net,tips:categories.tips.net,total:CATEGORIES.reduce((n,[k])=>n+categories[k].net,0)}});dailyCache.set(m.id,days);return days}
function dailyMarkup(m){return `<table class="daily-table"><thead><tr><th>Date (UTC)</th><th>Subs net</th><th>PPV net</th><th>Tips net</th><th>Total net</th></tr></thead><tbody>${dailyRecords(m).map(d=>`<tr><td>${m.id}-${String(d.day).padStart(2,'0')}</td><td class="money">${money(d.subs)}</td><td class="money">${money(d.ppv)}</td><td class="money">${money(d.tips)}</td><td class="money">${money(d.total)}</td></tr>`).join('')}</tbody></table>`}
function closeDateMenu(restoreFocus=false){const menu=$('#date-menu');if(!menu)return;menu.hidden=true;const trigger=$('[data-action=date]');trigger?.setAttribute('aria-expanded','false');if(restoreFocus)trigger?.focus({preventScroll:true})}
function openDates(trigger){const menu=$('#date-menu');if(!menu.hidden){closeDateMenu(true);return}menu.innerHTML=DATE_PRESETS.map(([key,label])=>`<button type="button" role="menuitemradio" data-action="date-preset" data-key="${key}" aria-checked="${state.year==='all'&&state.rangePreset===key}">${label}</button>`).join('');menu.hidden=false;trigger.setAttribute('aria-expanded','true');const rect=trigger.getBoundingClientRect(),box=menu.getBoundingClientRect();menu.dataset.anchorTop=String(rect.top);const scale=uiScale();menu.style.left=`${Math.max(12,Math.min(rect.left,innerWidth-box.width-12))/scale}px`;menu.style.top=`${(rect.bottom+6*scale+box.height<=innerHeight-12?rect.bottom+6*scale:Math.max(12,rect.top-box.height-6*scale))/scale}px`;(menu.querySelector('[aria-checked=true]')||menu.querySelector('button'))?.focus({preventScroll:true})}
function applyDatePreset(key){const end=new Date(DATA.end+'T12:00:00Z'),start=new Date(end);if(key==='all'){state.from=DATA.start}else{if(key==='last30'||key==='last90')start.setUTCDate(start.getUTCDate()-(key==='last30'?29:89));else if(key==='last12'){start.setUTCFullYear(start.getUTCFullYear()-1);start.setUTCDate(start.getUTCDate()+1)}else if(key==='year'){start.setUTCMonth(0,1)}else return;const iso=start.toISOString().slice(0,10);state.from=iso<DATA.start?DATA.start:iso}state.to=DATA.end;state.year='all';state.rangePreset=key;closeDateMenu(false);renderStatistics();$('[data-action=date]')?.focus({preventScroll:true})}

 function inboxMarkup(){return `<div class="chat-inbox-top">${button('back','Back to statements',icon('arrow'),'class="chat-icon-button chat-back"')}<h1>MESSAGES</h1><div class="chat-head-actions">${button('schedule','Schedule message',icon('calendar'))}${button('inbox-stats','Message statistics',icon('trend'))}${button('search','Search conversations',ci('search'))}${button('new','New conversation',icon('plus'))}</div></div><div class="chat-sort-row"><button type="button" class="chat-sort-button" data-action="chat-sort">${sortNewest?'NEWEST FIRST':'OLDEST FIRST'}</button><button type="button" class="chat-filter-button" data-action="chat-filter-menu" aria-label="Conversation filters">${ci('filter')}</button></div><div class="chat-filter-chips" role="group" aria-label="Conversation filters">${[['all','All'],['tips','With Tips'],['spenders','B-SPENDERS'],['following','Following']].map(([key,label])=>`<button type="button" class="chat-chip ${filter===key?'active':''}" data-action="chat-filter" data-key="${key}" aria-pressed="${filter===key}">${label}</button>`).join('')}<button type="button" class="chat-chip chat-chip-icon" data-action="chat-new" aria-label="Compose new conversation">${ci('edit')}</button></div><div class="chat-search-wrap" ${searchOpen?'':'hidden'}><label class="visually-hidden" for="chat-inbox-search">Search conversations</label><input id="chat-inbox-search" placeholder="Search name or message…" value="${safe(query)}" autocomplete="off"></div><div class="chat-inbox-list" id="chat-inbox-list">${filtered().map(contactMarkup).join('')||'<div class="chat-empty">No conversations match this filter.</div>'}</div>`}
 function headerMarkup(c){return `<div class="chat-thread-header">${button('thread-back','Back to conversations',icon('arrow'),'class="chat-icon-button chat-back"')}<div class="chat-thread-title"><div class="chat-thread-name"><span>${safe(c.name)}</span>${button('rename','Edit conversation name',ci('edit'))}</div><div class="chat-thread-meta"><span data-chat-seen>${c.lastSeenAt?'Seen just now':'Seen 5m ago'}</span><span class="chat-thread-divider"></span>${button('star',c.starred?'Remove favorite':'Favorite conversation',ci('star'),`aria-pressed="${!!c.starred}" class="chat-icon-button ${c.starred?'active':''}"`)}<span class="chat-thread-divider"></span>${button('mute',c.muted?'Unmute conversation':'Mute conversation',icon('bell'),`aria-pressed="${!!c.muted}" class="chat-icon-button ${!c.muted?'active':''}"`)}<span class="chat-thread-divider"></span>${button('notes','Conversation notes',icon('message'))}<span class="chat-thread-divider"></span>${button('pin',c.pinned?'Unpin conversation':'Pin conversation',ci('pin'),`aria-pressed="${!!c.pinned}" class="chat-icon-button ${c.pinned?'active':''}"`)}<span class="chat-thread-divider"></span><button type="button" class="chat-header-link" data-action="chat-gallery">${ci('gallery')}<span>Gallery</span></button><span class="chat-thread-divider"></span><button type="button" class="chat-header-link" data-action="chat-find">${ci('search')}<span>Find</span></button></div></div>${button('menu','Conversation menu',ci('dots'),'class="chat-icon-button chat-header-overflow"')}</div>${findOpen?`<div class="chat-find-wrap"><label class="visually-hidden" for="chat-find-input">Find in conversation</label><input id="chat-find-input" type="search" placeholder="Find in this conversation…" value="${safe(findQuery)}"><div class="chat-search-counter" id="chat-find-counter"></div></div>`:''}`}
 function messageMarkup(m,c){const out=m.direction==='out',match=findQuery&&m.text.toLowerCase().includes(findQuery.toLowerCase());return `<article class="chat-message ${out?'outgoing':'incoming'} ${match?'find-match':''}" data-message-id="${safe(m.id)}">${!out?`<div class="chat-message-avatar">${safe(initials(c))}</div>`:''}${out?`<div class="chat-inline-actions">${button('message-menu','Message options',ci('dots'),`data-mid="${safe(m.id)}" class="chat-icon-button chat-message-more"`)}</div>`:''}<div class="chat-bubble-stack"><div class="chat-bubble">${m.price?`<span class="chat-ppv-label">${ci('price')} PPV ${money(m.price)}</span>`:''}${m.reply?`<div class="chat-reply-quote">${safe(m.reply)}</div>`:''}${m.attachment?`<div class="chat-attachment">${ci('gallery')}<span>${safe(m.attachment)}</span></div>`:''}<p>${safe(m.text).replace(/\n/g,'<br>')}</p><button type="button" class="chat-translate" data-action="chat-translate" data-mid="${safe(m.id)}">${ci('translate')} ${m.translated?'Hide translation':'Translate'}</button>${m.translated?`<p class="chat-translated">${safe(m.translation||'Danke für deine Nachricht! Ich freue mich auf das nächste Update.')}</p>`:''}${m.schedule?`<div class="chat-scheduled">Scheduled · ${safe(scheduledLabel(m.schedule,m.scheduleAt))}</div>`:''}</div><div class="chat-message-meta">${m.liked&&!out?'<span class="chat-liked">♥</span>':''}<span>${safe(Number.isFinite(m.createdAt)?stamp(m.createdAt):m.time)}${out?' · sent by Jo jo':''}</span>${out?ci('check'):''}</div></div>${!out?`<div class="chat-inline-actions">${button('message-menu','Message options',ci('dots'),`data-mid="${safe(m.id)}" class="chat-icon-button chat-message-more"`)}${button('like',m.liked?'Unlike message':'Like message',ci('heart'),`data-mid="${safe(m.id)}" aria-pressed="${!!m.liked}" class="chat-icon-button ${m.liked?'is-liked':''}"`)}${button('reply','Reply to message',ci('mail'),`data-mid="${safe(m.id)}"`)}</div>`:''}</article>`}
 function composerMarkup(){return `<button type="button" class="chat-scroll-latest" data-action="chat-latest" aria-label="Scroll to latest message">${icon('chevron')}</button><form class="chat-composer" id="chat-compose-form"><div class="chat-emoji-bar">${emojis.map(e=>`<button type="button" data-action="chat-emoji" data-emoji="${safe(e)}" aria-label="Insert ${safe(e)}">${e}</button>`).join('')}<button type="button" class="chat-emoji-open" data-action="chat-emojis" aria-label="More emojis">${ci('smile')}</button></div><label class="visually-hidden" for="chat-message-text">Type a message</label><textarea class="chat-compose-text" id="chat-message-text" name="text" placeholder="Type a message…" maxlength="3000">${safe(draft)}</textarea><div class="chat-draft-details" id="chat-draft-details">${draftTokens()}</div><div class="chat-quick-chips">${Object.keys(quickReplies).map(key=>`<button type="button" data-action="chat-quick" data-key="${safe(key)}">${key}</button>`).join('')}</div><div class="chat-compose-bottom"><div class="chat-compose-tools">${button('attach','Attach image or file',ci('gallery'))}${button('gif','Insert GIF',ci('gif'))}${button('video','Attach video',ci('video'))}${button('voice','Voice message',ci('mic'))}${button('gallery','Open media vault',icon('media'))}${button('gallery','Add gallery preview',ci('vaultadd'),'class="chat-icon-button chat-tool-special"')}${button('schedule','Schedule message',ci('schedule'))}${button('price','Set PPV price',ci('price'))}${button('mention','Mention subscriber',ci('at'))}<button type="button" class="chat-icon-button chat-text-icon" data-action="chat-format" aria-label="Text formatting">Aa</button></div><button type="button" class="chat-send-mode" data-action="chat-send-mode" aria-label="Message send mode">∴</button><button type="submit" class="chat-send-button">SEND ${ci('clock')}</button></div><input type="file" class="chat-attachment-input" id="chat-file-input" aria-label="Choose local attachment"></form>`}
 function draftTokens(){return `${replyTo?`<span class="chat-draft-token">Reply: ${safe(replyTo.text.slice(0,35))}<button type="button" data-action="chat-clear-reply" aria-label="Cancel reply">×</button></span>`:''}${draftAttachment?`<span class="chat-draft-token">${safe(draftAttachment)}<button type="button" data-action="chat-clear-attachment" aria-label="Remove attachment">×</button></span>`:''}${draftPrice?`<span class="chat-draft-token">PPV ${money(draftPrice)}<button type="button" data-action="chat-clear-price" aria-label="Remove PPV price">×</button></span>`:''}${draftSchedule?`<span class="chat-draft-token">${safe(scheduledLabel(draftSchedule))}<button type="button" data-action="chat-clear-schedule" aria-label="Cancel schedule">×</button></span>`:''}`}
 function syncDraft(){const box=document.getElementById('chat-message-text');if(box)draft=box.value}
 function updateDraft(){const box=document.getElementById('chat-message-text');if(box)box.value=draft;const tokens=document.getElementById('chat-draft-details');if(tokens)tokens.innerHTML=draftTokens()}
 function focusDraft(){document.getElementById('chat-message-text')?.focus({preventScroll:true})}
 function render(options={}){initializeTimestamps();const root=document.getElementById('chat-root');if(!root)return;const oldScroll=root.querySelector('.chat-thread-scroll')?.scrollTop||0,c=current();if(c)selected=c.id;root.classList.toggle('chat-mobile-detail',mobileDetail);root.innerHTML=`<section class="chat-inbox" aria-label="Conversations">${inboxMarkup()}</section><section class="chat-thread" aria-label="${c?'Conversation with '+safe(c.name):'Conversation'}">${c?headerMarkup(c)+`<div class="chat-thread-scroll" id="chat-thread-scroll" aria-live="polite">${c.messages.map(m=>messageMarkup(m,c)).join('')}</div>`+composerMarkup():'<div class="chat-thread-empty">Choose a conversation to start.</div>'}</section>`;root.oninput=input;root.onchange=change;root.onkeydown=keydown;const scroll=root.querySelector('.chat-thread-scroll');if(scroll)scroll.scrollTop=options.bottom?scroll.scrollHeight:options.keepScroll?oldScroll:0;updateFindCounter();if(scroll)scroll.onscroll=()=>{if(scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<=48)markRead(current())};if(options.focus)focusDraft();startSimulation()}
 function renderInbox(){const root=document.getElementById('chat-inbox-list');if(!root)return;const active=document.activeElement,row=active?.closest('.chat-contact'),restore=root.contains(active)?{id:row?.dataset.id,action:active?.dataset.action}:null,top=root.scrollTop;root.innerHTML=filtered().map(contactMarkup).join('')||'<div class="chat-empty">No conversations match this filter.</div>';root.scrollTop=top;if(restore?.id){const replacement=[...root.querySelectorAll('.chat-contact')].find(x=>x.dataset.id===restore.id);const control=restore.action==='chat-select'?replacement:replacement?.querySelector(`[data-action="${restore.action}"]`);control?.focus({preventScroll:true})}}
 function updateFindCounter(){const counter=document.getElementById('chat-find-counter');if(counter){const matches=current()?.messages.filter(m=>findQuery&&m.text.toLowerCase().includes(findQuery.toLowerCase())).length||0;counter.textContent=findQuery?`${matches} matching message${matches===1?'':'s'}`:''}}
 function input(e){if(e.target.id==='chat-message-text')draft=e.target.value;if(e.target.id==='chat-inbox-search'){query=e.target.value;renderInbox()}if(e.target.id==='chat-find-input'){findQuery=e.target.value;const q=findQuery.toLowerCase();document.querySelectorAll('#chat-thread-scroll .chat-message').forEach(row=>{const m=current().messages.find(m=>m.id===row.dataset.messageId);row.classList.toggle('find-match',!!q&&!!m&&m.text.toLowerCase().includes(q))});updateFindCounter()}}
 function change(e){if(e.target.id==='chat-file-input'){const file=e.target.files?.[0];if(file){draftAttachment=file.name;updateDraft();toast('Attachment added to this local demo');focusDraft()}}}
 function keydown(e){if(e.target.id==='chat-message-text'&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();document.getElementById('chat-compose-form')?.requestSubmit()}const row=e.target.closest('.chat-contact');if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();action(row)}}
 const message=id=>current()?.messages.find(m=>m.id===id);
 function draftDialog(kind){syncDraft();if(kind==='price')modal('PPV price',`<form id="chat-price-form"><label class="form-field">Message price (USD)<input name="price" type="number" min="0" max="1000" step="0.01" value="${(draftPrice/100).toFixed(2)}" required></label><div class="dialog-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button type="submit" class="blue-button">APPLY</button></div></form>`);if(kind==='schedule')modal('Schedule message',`<form id="chat-schedule-form"><label class="form-field">Date and time (Berlin)<input name="schedule" type="datetime-local" value="${safe(draftSchedule||berlinInput(Date.now()+3600000))}" required></label><p class="chat-modal-note">Saved as a scheduled message in this local demo.</p><div class="dialog-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button type="submit" class="blue-button">SET SCHEDULE</button></div></form>`)}
 function action(b){const act=b.dataset.action.replace(/^chat-/,''),c=current();switch(act){
 case 'back':location.hash='#/statements/statistics';break;
 case 'thread-back':mobileDetail=false;render();break;
 case 'select':syncDraft();selected=b.dataset.id;markRead(current());mobileDetail=true;findQuery='';replyTo=null;render();break;
 case 'filter':syncDraft();filter=b.dataset.key;render({keepScroll:true});break;
 case 'sort':sortNewest=!sortNewest;render({keepScroll:true});break;
 case 'filter-menu':modal('Conversation filters',`<div class="simple-list">${[['all','All'],['tips','With Tips'],['spenders','B-SPENDERS'],['following','Following']].map(([key,label])=>`<button type="button" data-action="chat-filter-modal" data-key="${key}">${label}${filter===key?' ✓':''}</button>`).join('')}</div>`);break;
 case 'filter-modal':filter=b.dataset.key;closeModal();render({keepScroll:true});break;
 case 'search':syncDraft();searchOpen=!searchOpen;if(!searchOpen)query='';render({keepScroll:true});document.getElementById('chat-inbox-search')?.focus();break;
 case 'find':syncDraft();findOpen=!findOpen;if(!findOpen)findQuery='';render({keepScroll:true});document.getElementById('chat-find-input')?.focus();break;
 case 'latest':{const scroll=document.getElementById('chat-thread-scroll');if(scroll)scroll.scrollTop=scroll.scrollHeight;markRead(current());break}
 case 'star':case 'mute':case 'pin':{if(!c)break;const key={star:'starred',mute:'muted',pin:'pinned'}[act];c[key]=!c[key];persist();syncDraft();if(!document.getElementById('modal').hidden)closeModal();render({keepScroll:true});toast(act==='star'?(c.starred?'Added to favorites':'Removed from favorites'):act==='mute'?(c.muted?'Conversation muted':'Conversation unmuted'):(c.pinned?'Conversation pinned':'Conversation unpinned'));break}
 case 'translate':{const m=message(b.dataset.mid);if(m){m.translated=!m.translated;persist();syncDraft();render({keepScroll:true})}break}
 case 'like':{const m=message(b.dataset.mid);if(m){m.liked=!m.liked;persist();syncDraft();render({keepScroll:true})}break}
 case 'reply':{const m=message(b.dataset.mid);if(m){replyTo={id:m.id,text:m.text};updateDraft();focusDraft()}break}
 case 'message-menu':{const m=message(b.dataset.mid);if(m)modal('Message options',`<p>${safe(m.text)}</p><div class="simple-list"><button type="button" data-action="chat-reply-modal" data-mid="${safe(m.id)}">Reply</button><button type="button" data-action="chat-copy-message" data-mid="${safe(m.id)}">Copy message text</button><button type="button" data-action="chat-like-modal" data-mid="${safe(m.id)}">${m.liked?'Remove like':'Like message'}</button></div>`);break}
 case 'reply-modal':{const m=message(b.dataset.mid);if(m)replyTo={id:m.id,text:m.text};closeModal();updateDraft();focusDraft();break}
 case 'like-modal':{const m=message(b.dataset.mid);if(m){m.liked=!m.liked;persist()}closeModal();render({keepScroll:true});break}
 case 'copy-message':{const m=message(b.dataset.mid);if(m){navigator.clipboard?.writeText(m.text).then(()=>toast('Message text copied')).catch(()=>toast('Select the message text to copy it'))}break}
 case 'emoji':syncDraft();draft+=b.dataset.emoji;updateDraft();focusDraft();break;
 case 'emojis':modal('Choose an emoji',`<div class="chat-emoji-picker">${[...emojis,'💙','✨','🎵','🙌','🌞','🌸','📸','🎬','💬','💫','🌊','🎉','🤍','🫶','🌟','😁','🥳','☕','🌈','🦋','💌','🌹','🍒','😎'].map(e=>`<button type="button" data-action="chat-emoji-modal" data-emoji="${safe(e)}">${e}</button>`).join('')}</div>`);break;
 case 'emoji-modal':syncDraft();draft+=b.dataset.emoji;closeModal();updateDraft();focusDraft();break;
 case 'quick':syncDraft();draft=quickReplies[b.dataset.key]||draft;if(b.dataset.key==='PPV')draftPrice=draftPrice||2500;updateDraft();focusDraft();break;
 case 'price':draftDialog('price');break;
 case 'schedule':draftDialog('schedule');break;
 case 'clear-reply':replyTo=null;updateDraft();break;
 case 'clear-attachment':draftAttachment='';updateDraft();break;
 case 'clear-price':draftPrice=0;updateDraft();break;
 case 'clear-schedule':draftSchedule='';updateDraft();break;
 case 'mention':syncDraft();draft+=(draft&&!draft.endsWith(' ')?' ':'')+'@'+(c?.handle||'subscriber')+' ';updateDraft();focusDraft();break;
 case 'format':syncDraft();modal('Message formatting',`<div class="simple-list"><button type="button" data-action="chat-format-apply" data-key="bold">Bold text</button><button type="button" data-action="chat-format-apply" data-key="italic">Italic text</button><button type="button" data-action="chat-format-apply" data-key="list">Bullet list</button></div>`);break;
 case 'format-apply':draft=b.dataset.key==='bold'?`**${draft||'Your text'}**`:b.dataset.key==='italic'?`_${draft||'Your text'}_`:`• ${draft||'First point'}\n• Second point`;closeModal();updateDraft();focusDraft();break;
 case 'attach':case 'video':{const input=document.getElementById('chat-file-input');if(input){input.accept=act==='video'?'video/*':'image/*,.pdf';input.click()}break}
 case 'gif':modal('Choose a demo GIF',`<div class="chat-gallery-grid">${['Hello 👋','Thank you 💙','Celebration 🎉'].map((name,i)=>`<button type="button" class="chat-gallery-item" data-action="chat-add-gif" data-key="${i}"><span style="font-size:30px">${['👋','💙','🎉'][i]}</span><span>${name}</span></button>`).join('')}</div>`);break;
 case 'add-gif':draftAttachment=['Hello.gif','Thank you.gif','Celebration.gif'][Number(b.dataset.key)];closeModal();updateDraft();focusDraft();break;
 case 'voice':syncDraft();modal('Voice message',`<p>Choose a sample voice-note attachment for this presentation.</p><button type="button" class="blue-button" data-action="chat-add-voice">ADD DEMO VOICE NOTE</button>`);break;
 case 'add-voice':draftAttachment='Voice note · 0:12';closeModal();updateDraft();focusDraft();break;
 case 'gallery':syncDraft();modal('Gallery',`<div class="chat-gallery-grid">${['Studio preview','Weekend update','Behind the scenes','Blue collection','New favourites','Thank-you note'].map((name,i)=>`<button type="button" class="chat-gallery-item" data-action="chat-gallery-item" data-key="${i}">${ci('gallery')}<span>${name}</span></button>`).join('')}</div>`);break;
 case 'gallery-item':{const names=['Studio preview','Weekend update','Behind the scenes','Blue collection','New favourites','Thank-you note'];const label=names[Number(b.dataset.key)]||'Studio preview';modal(label,`<div class="chat-gallery-preview">${ci('gallery')}<span>${safe(label)}</span></div><div class="dialog-actions"><button type="button" class="secondary" data-action="chat-gallery">Back</button><button type="button" class="blue-button" data-action="chat-attach-gallery" data-key="${safe(label)}">ATTACH PREVIEW</button></div>`);break}
 case 'attach-gallery':draftAttachment=b.dataset.key+'.jpg';closeModal();updateDraft();focusDraft();break;
 case 'send-mode':modal('Send mode','<p>Messages are saved only in this browser for the presentation.</p><div class="simple-list"><button type="button" data-action="close">Single recipient ✓</button><button type="button" data-action="chat-price">Set PPV price</button><button type="button" data-action="chat-schedule">Schedule message</button></div>');break;
 case 'new':modal('New conversation',`<form id="chat-new-form"><label class="form-field">Display name<input name="name" required maxlength="50" placeholder="Demo subscriber"></label><label class="form-field">First message<textarea name="message" maxlength="3000" placeholder="Write a friendly welcome…"></textarea></label><div class="dialog-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button class="blue-button" type="submit">CREATE CONVERSATION</button></div></form>`);break;
 case 'rename':if(c)modal('Edit conversation',`<form id="chat-rename-form"><label class="form-field">Display name<input name="name" required maxlength="50" value="${safe(c.name)}"></label><button class="blue-button" type="submit">SAVE NAME</button></form>`);break;
 case 'notes':if(c)modal('Conversation notes',`<form id="chat-notes-form"><label class="form-field">Private demo note<textarea name="notes" maxlength="2000">${safe(c.notes||'')}</textarea></label><button class="blue-button" type="submit">SAVE NOTE</button></form>`);break;
 case 'contact-info':{const person=contacts.find(x=>x.id===b.dataset.id);if(person)modal(person.name,`<p>@${safe(person.handle)}</p><div class="chat-stats-line"><span>Demo spend</span><strong>${money(person.spend)}</strong></div><div class="chat-stats-line"><span>Subscription</span><strong>${safe(person.status)}</strong></div><div class="chat-stats-line"><span>Messages</span><strong>${person.messages.length}</strong></div><p class="chat-modal-note">Fictional subscriber for the internal presentation.</p>`);break}
 case 'inbox-stats':modal('Message statistics',`<div class="chat-stats-line"><span>Demo conversations</span><strong>${contacts.filter(c=>!c.archived).length}</strong></div><div class="chat-stats-line"><span>Messages</span><strong>${contacts.reduce((n,c)=>n+c.messages.length,0)}</strong></div><div class="chat-stats-line"><span>PPV Messages · all time gross</span><strong>${money(sums(DATA.months).categories.messages.gross)}</strong></div><p><a class="text-button" href="#/statements/statistics">Open earning statistics</a></p>`);break;
 case 'archive':{const person=contacts.find(x=>x.id===b.dataset.id);if(person)modal('Archive conversation',`<p>Archive ${safe(person.name)} from this demo inbox?</p><div class="dialog-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button type="button" class="blue-button" data-action="chat-archive-confirm" data-id="${safe(person.id)}">ARCHIVE</button></div>`);break}
 case 'archive-confirm':{const person=contacts.find(x=>x.id===b.dataset.id);if(person){person.archived=true;lastDeleted=person.id;persist();if(selected===person.id)selected=contacts.find(x=>!x.archived)?.id||selected}closeModal();render();toast('Conversation archived. Restore it from the conversation menu.');break}
 case 'restore':{const person=contacts.find(x=>x.id===lastDeleted);if(person){person.archived=false;selected=person.id;persist();lastDeleted=null}closeModal();render();toast('Conversation restored');break}
 case 'menu':modal('Conversation menu',`<div class="simple-list"><button type="button" data-action="chat-contact-info" data-id="${safe(c?.id||'')}">Subscriber details</button><button type="button" data-action="chat-notes">Private note</button><button type="button" data-action="chat-star">${c?.starred?'Remove favorite':'Add to favorites'}</button><button type="button" data-action="chat-mute">${c?.muted?'Unmute conversation':'Mute conversation'}</button>${lastDeleted?'<button type="button" data-action="chat-restore">Restore archived conversation</button>':''}<button type="button" data-action="chat-new">New conversation</button></div>`);break;
 default:return false;
 }return true}
 function submit(form){const d=new FormData(form),c=current();if(form.id==='chat-compose-form'){syncDraft();if(!c||(!draft.trim()&&!draftAttachment)){focusDraft();return true}const m=outgoing(draft.trim(),stamp(),{price:draftPrice,attachment:draftAttachment,schedule:draftSchedule,scheduleAt:draftSchedule?berlinEpoch(draftSchedule):undefined,scheduleZone:berlinZone,reply:replyTo?.text||''});c.messages.push(m);limitHistory(c);c.updatedAt=m.createdAt;c.unread=0;c.preview=m.text||m.attachment;c.time=m.time;contacts=[c,...contacts.filter(x=>x.id!==c.id)];draft='';draftAttachment='';draftPrice=0;draftSchedule='';replyTo=null;persist();render({bottom:true,focus:true});return true}
 if(form.id==='chat-new-form'){const name=String(d.get('name')||'').trim();if(!name)return true;const text=String(d.get('message')||'').trim(),id=nextId('demo');contacts.unshift({id,name,handle:'demo'+Date.now().toString().slice(-6),spend:0,level:1,status:'Rebill On',tips:false,following:false,updatedAt:Date.now(),unread:0,time:stamp(),preview:text||'New conversation',messages:text?[outgoing(text,stamp())]:[]});selected=id;mobileDetail=true;filter='all';query='';persist();closeModal();render({bottom:true,focus:true});toast('Demo conversation created');return true}
 if(form.id==='chat-price-form'){const price=Number(d.get('price'));if(!Number.isFinite(price)||price<0||price>1000)return true;draftPrice=Math.round(price*100);closeModal();updateDraft();focusDraft();return true}
 if(form.id==='chat-schedule-form'){const value=String(d.get('schedule')||''),at=berlinEpoch(value);if(!Number.isFinite(at)||berlinInput(at)!==value){toast('Choose a valid Berlin date and time');return true}draftSchedule=value;closeModal();updateDraft();focusDraft();return true}
 if(form.id==='chat-rename-form'&&c){const name=String(d.get('name')||'').trim();if(name)c.name=name;persist();closeModal();render({keepScroll:true});return true}
 if(form.id==='chat-notes-form'&&c){c.notes=String(d.get('notes')||'');persist();closeModal();toast('Conversation note saved locally');return true}return false}
 function reset(){stopSimulation();contacts=copy(seed);timestampsInitialized=false;sessionOpenedAt=null;senderRotation=[];messageRotation=[];lastSender=null;arrivalCount=0;lastArrivalAt=null;recentDelays=[];recentSenders=[];selected='milo';filter='all';query='';findQuery='';searchOpen=false;findOpen=false;mobileDetail=false;replyTo=null;draft='';draftAttachment='';draftPrice=0;draftSchedule='';lastDeleted=null;persist();if(chatVisible()){initializeTimestamps();startSimulation()}}
 function addMessage({to,text,price=0}){const target=String(to||'Demo subscriber'),value=String(text||'');let c=contacts.find(x=>x.name.toLowerCase()===target.toLowerCase()||x.handle.toLowerCase()===target.toLowerCase());if(!c){const id=nextId('demo');c={id,name:target,handle:'demo'+Date.now().toString().slice(-6),spend:0,level:1,status:'Rebill On',tips:false,following:false,messages:[]};contacts.unshift(c)}const m=outgoing(value,stamp(),{price:Math.max(0,Math.round(Number(price)||0))});c.archived=false;c.messages.push(m);limitHistory(c);c.updatedAt=m.createdAt;c.unread=0;c.preview=value;c.time=m.time;contacts=[c,...contacts.filter(x=>x.id!==c.id)];selected=c.id;mobileDetail=true;persist();return m}

 const liveMessages=[
  'hey, i just saw the new update 😊','which set are you sharing next?','that blue background looked great','thanks for the preview! 💙','the studio playlist is still stuck in my head 🎵','i finally have a quiet evening to catch up','hope your day is going well','did the photo shoot turn out how you planned?','is there a new gallery coming this week?','your last message made me smile','the colours in that preview are lovely','what was your favourite part of the shoot?','just dropping by to say hi 👋','i saved the new gallery to my favourites','that behind-the-scenes clip was so good','do you have a song recommendation for today?','i am looking forward to the weekend update','the little details in the new set are amazing','how is your evening going?','can you show another studio preview soon?','your new update just made my day 😊','i had to come back and see that photo again','what are you working on this week?','thanks for taking the time to chat','the lighting in the last preview was perfect','i really like this new style ✨','will the next collection have the same colours?','hello again, i am back for the updates 💬'
 ];
 function shuffled(values){const out=values.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
 function limitHistory(c){return c.messages.length>80?c.messages.splice(0,c.messages.length-80):[]}
 function initializeTimestamps(){if(timestampsInitialized)return;sessionOpenedAt=Date.now();contacts.forEach((c,index)=>{const source=seed.find(x=>x.id===c.id),legacyAnchor=sessionOpenedAt-index*60000;c.messages.forEach((m,i)=>{const original=source?.messages.some(x=>x.text===m.text&&x.direction===m.direction);if(m.demoSeed===true||(m.demoSeed===undefined&&original&&!Number.isFinite(m.createdAt)))m.demoSeed=true;else if(m.demoSeed===undefined)m.demoSeed=false;if(!Number.isFinite(m.createdAt))m.createdAt=legacyAnchor-(c.messages.length-1-i)*60000;if(m.schedule&&!Number.isFinite(m.scheduleAt)){if(m.scheduleZone===berlinZone)m.scheduleAt=berlinEpoch(m.schedule);else{const utc=Date.parse(m.schedule+'Z');if(Number.isFinite(utc)){m.scheduleAt=utc;m.schedule=berlinInput(utc)}}m.scheduleZone=berlinZone}});const seeded=c.messages.filter(m=>m.demoSeed);seeded.forEach((m,i)=>m.createdAt=legacyAnchor-(seeded.length-1-i)*60000);c.messages.forEach(m=>m.time=stamp(m.createdAt));c.messages.sort((a,b)=>a.createdAt-b.createdAt);limitHistory(c);const latest=c.messages.at(-1);if(latest)c.preview=latest.text||latest.attachment||c.preview;c.updatedAt=latest?.createdAt??(Number.isFinite(c.updatedAt)?c.updatedAt:legacyAnchor);c.time=stamp(c.updatedAt);c.unread=Math.max(0,Math.min(80,Number(c.unread)||0))});timestampsInitialized=true;persist()}
 function chatVisible(){const root=document.getElementById('chat-root');return !!root&&!root.hidden&&document.visibilityState!=='hidden'&&getComputedStyle(root).display!=='none'&&(location.hash.replace(/^#\/?/,'')==='messages'||document.body.classList.contains('chat-mode'))}
 function threadVisible(c){const thread=document.querySelector('#chat-root .chat-thread');return !!c&&c.id===selected&&chatVisible()&&!!thread&&getComputedStyle(thread).display!=='none'}
 function markRead(c){if(c&&c.unread){c.unread=0;persist();renderInbox()}}
 function pauseTimer(){if(simulationTimer!==null){clearTimeout(simulationTimer);simulationTimer=null}nextDelay=0;nextAt=null}
 function scheduleNext(){if(!simulationRequested||simulationTimer!==null||!chatVisible())return;nextDelay=3000+Math.floor(Math.random()*13001);nextAt=Date.now()+nextDelay;recentDelays.push(nextDelay);if(recentDelays.length>20)recentDelays.shift();scheduleCount++;simulationTimer=setTimeout(()=>{simulationTimer=null;nextAt=null;if(!simulationRequested||!chatVisible()){nextDelay=0;return}emitIncoming();scheduleNext()},nextDelay)}
 function startSimulation(){simulationRequested=true;if(chatVisible()){initializeTimestamps();scheduleNext()}}
 function stopSimulation(){simulationRequested=false;pauseTimer()}
 function chooseSender(forced){const active=contacts.filter(c=>!c.archived);if(!active.length)return null;if(forced)return active.find(c=>c.id===forced)||null;senderRotation=senderRotation.filter(id=>active.some(c=>c.id===id));if(!senderRotation.length){senderRotation=shuffled(active.map(c=>c.id));if(senderRotation.length>1&&senderRotation[0]===lastSender)[senderRotation[0],senderRotation[1]]=[senderRotation[1],senderRotation[0]]}let id=senderRotation.shift();if(id===lastSender&&active.length>1){if(senderRotation.length){const other=senderRotation.shift();senderRotation.push(id);id=other}else{id=active.find(c=>c.id!==lastSender).id}}return active.find(c=>c.id===id)}
 function emitIncoming(forcedContactId){initializeTimestamps();const c=chooseSender(forcedContactId);if(!c)return null;if(!messageRotation.length)messageRotation=shuffled(liveMessages.map((_,i)=>i));const text=liveMessages[messageRotation.shift()],createdAt=Date.now(),m=incoming(text,undefined,{createdAt,simulation:true}),scroll=document.getElementById('chat-thread-scroll'),show=threadVisible(c),wasAtBottom=show&&scroll&&scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<=48,previousScroll=scroll?.scrollTop||0;c.messages.push(m);const removed=limitHistory(c);c.preview=m.text;c.time=stamp(createdAt);c.updatedAt=createdAt;c.lastSeenAt=createdAt;c.online=true;c.unread=show&&wasAtBottom?0:Math.min(80,(c.unread||0)+1);contacts=[c,...contacts.filter(x=>x.id!==c.id)];lastSender=c.id;lastArrivalAt=createdAt;arrivalCount++;recentSenders.push(c.id);if(recentSenders.length>20)recentSenders.shift();persist();renderInbox();if(show&&scroll){let removedHeight=0;for(const old of removed){const element=[...scroll.querySelectorAll('[data-message-id]')].find(x=>x.dataset.messageId===old.id);if(element){removedHeight+=element.offsetHeight+(parseFloat(getComputedStyle(element).marginBottom)||0);element.remove()}}scroll.insertAdjacentHTML('beforeend',messageMarkup(m,c));scroll.scrollTop=wasAtBottom?scroll.scrollHeight:Math.max(0,previousScroll-removedHeight);const seen=document.querySelector('#chat-root [data-chat-seen]');if(seen)seen.textContent='Seen just now';updateFindCounter()}return {senderId:c.id,id:m.id,text:m.text,createdAt:m.createdAt,time:m.time}}
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')pauseTimer();else if(simulationRequested)startSimulation()});
 window.addEventListener('pagehide',stopSimulation);
 window.addEventListener('pageshow',()=>{if(chatVisible())startSimulation()});
 window.addEventListener('hashchange',()=>{if(location.hash.replace(/^#\/?/,'')!=='messages')stopSimulation()});
 return {render,action,submit,reset,addMessage,change,keydown,startSimulation,stopSimulation,emitIncoming,formatTime:stamp,getState:()=>({selected,filter,query,draft,contacts:copy(contacts),sessionOpenedAt,simulation:{running:simulationTimer!==null,requested:simulationRequested,pendingTimers:simulationTimer!==null?1:0,nextDelay,nextAt,lastSender,lastArrivalAt,arrivals:arrivalCount,scheduleCount,recentDelays:recentDelays.slice(),recentSenders:recentSenders.slice()}})};

})();
