 const contactMarkup=c=>`<div class="chat-contact ${c.id===selected?'selected':''} ${c.spend>=10000?'big-spender':''} ${c.unread?'has-unread':''}" role="button" tabindex="0" data-action="chat-select" data-id="${safe(c.id)}" aria-label="Open conversation with ${safe(c.name)}" ${c.id===selected?'aria-current="true"':''}><div class="chat-contact-avatar ${c.tips?'has-tips':''} ${c.following?'following':''}">${ci(c.tips?'tipface':'sad','chat-face')}<span class="chat-spend-badge ${c.spend>=10000?'big':''}">${money(c.spend).replace('.00','')}</span>${c.online?'<span class="chat-online"></span>':''}</div><div class="chat-contact-copy"><div class="chat-contact-status">${Array.from({length:5},(_,i)=>`<span class="chat-level-dot ${i<c.level?'filled':''}"></span>`).join('')}<span class="chat-rebill ${c.status==='Expired'?'expired':c.status==='Rebill On'?'on':''}">${safe(c.status)}</span></div><div class="chat-contact-name"><strong>${safe(c.name)}</strong><span class="chat-handle">@${safe(c.handle)}</span></div><div class="chat-contact-preview">${safe(c.preview)}</div></div><span class="chat-contact-time">${safe(Number.isFinite(c.updatedAt)?stamp(c.updatedAt):c.time)}</span>${c.unread?`<span class="chat-unread-count" aria-label="${c.unread} unread messages">${c.unread>99?'99+':c.unread}</span>`:''}<span class="chat-contact-actions">${button('contact-info','Conversation details',ci('external'),`data-id="${safe(c.id)}"`)}${button('archive','Archive conversation',ci('close'),`data-id="${safe(c.id)}"`)}</span></div>`;
 function inboxMarkup(){return `<div class="chat-inbox-top">${button('back','Back to statements',icon('arrow'),'class="chat-icon-button chat-back"')}<h1>MESSAGES</h1><div class="chat-head-actions">${button('schedule','Schedule message',icon('calendar'))}${button('inbox-stats','Message statistics',icon('trend'))}${button('search','Search conversations',ci('search'))}${button('new','New conversation',icon('plus'))}</div></div><div class="chat-sort-row"><button type="button" class="chat-sort-button" data-action="chat-sort">${sortNewest?'NEWEST FIRST':'OLDEST FIRST'}</button><button type="button" class="chat-filter-button" data-action="chat-filter-menu" aria-label="Conversation filters">${ci('filter')}</button></div><div class="chat-filter-chips" role="group" aria-label="Conversation filters">${[['all','All'],['tips','With Tips'],['spenders','B-SPENDERS'],['following','Following']].map(([key,label])=>`<button type="button" class="chat-chip ${filter===key?'active':''}" data-action="chat-filter" data-key="${key}" aria-pressed="${filter===key}">${label}</button>`).join('')}<button type="button" class="chat-chip chat-chip-icon" data-action="chat-new" aria-label="Compose new conversation">${ci('edit')}</button></div><div class="chat-search-wrap" ${searchOpen?'':'hidden'}><label class="visually-hidden" for="chat-inbox-search">Search conversations</label><input id="chat-inbox-search" placeholder="Search name or message…" value="${safe(query)}" autocomplete="off"></div><div class="chat-inbox-list" id="chat-inbox-list">${filtered().map(contactMarkup).join('')||'<div class="chat-empty">No conversations match this filter.</div>'}</div>`}
 function headerMarkup(c){return `<div class="chat-thread-header">${button('thread-back','Back to conversations',icon('arrow'),'class="chat-icon-button chat-back"')}<div class="chat-thread-title"><div class="chat-thread-name"><span>${safe(c.name)}</span>${button('rename','Edit conversation name',ci('edit'))}</div><div class="chat-thread-meta"><span data-chat-seen>${c.lastSeenAt?'Seen just now':'Seen 5m ago'}</span><span class="chat-thread-divider"></span>${button('star',c.starred?'Remove favorite':'Favorite conversation',ci('star'),`aria-pressed="${!!c.starred}" class="chat-icon-button ${c.starred?'active':''}"`)}<span class="chat-thread-divider"></span>${button('mute',c.muted?'Unmute conversation':'Mute conversation',icon('bell'),`aria-pressed="${!!c.muted}" class="chat-icon-button ${!c.muted?'active':''}"`)}<span class="chat-thread-divider"></span>${button('notes','Conversation notes',icon('message'))}<span class="chat-thread-divider"></span>${button('pin',c.pinned?'Unpin conversation':'Pin conversation',ci('pin'),`aria-pressed="${!!c.pinned}" class="chat-icon-button ${c.pinned?'active':''}"`)}<span class="chat-thread-divider"></span><button type="button" class="chat-header-link" data-action="chat-gallery">${ci('gallery')}<span>Gallery</span></button><span class="chat-thread-divider"></span><button type="button" class="chat-header-link" data-action="chat-find">${ci('search')}<span>Find</span></button></div></div>${button('menu','Conversation menu',ci('dots'),'class="chat-icon-button chat-header-overflow"')}</div>${findOpen?`<div class="chat-find-wrap"><label class="visually-hidden" for="chat-find-input">Find in conversation</label><input id="chat-find-input" type="search" placeholder="Find in this conversation…" value="${safe(findQuery)}"><div class="chat-search-counter" id="chat-find-counter"></div></div>`:''}`}
 function messageMarkup(m,c){const out=m.direction==='out',match=findQuery&&m.text.toLowerCase().includes(findQuery.toLowerCase());return `<article class="chat-message ${out?'outgoing':'incoming'} ${match?'find-match':''}" data-message-id="${safe(m.id)}">${!out?`<div class="chat-message-avatar">${safe(initials(c))}</div>`:''}${out?`<div class="chat-inline-actions">${button('message-menu','Message options',ci('dots'),`data-mid="${safe(m.id)}" class="chat-icon-button chat-message-more"`)}</div>`:''}<div class="chat-bubble-stack"><div class="chat-bubble">${m.price?`<span class="chat-ppv-label">${ci('price')} PPV ${money(m.price)}</span>`:''}${m.reply?`<div class="chat-reply-quote">${safe(m.reply)}</div>`:''}${m.attachment?`<div class="chat-attachment">${ci('gallery')}<span>${safe(m.attachment)}</span></div>`:''}<p>${safe(m.text).replace(/\n/g,'<br>')}</p><button type="button" class="chat-translate" data-action="chat-translate" data-mid="${safe(m.id)}">${ci('translate')} ${m.translated?'Hide translation':'Translate'}</button>${m.translated?`<p class="chat-translated">${safe(m.translation||'Danke für deine Nachricht! Ich freue mich auf das nächste Update.')}</p>`:''}${m.schedule?`<div class="chat-scheduled">Scheduled · ${safe(scheduledLabel(m.schedule,m.scheduleAt))}</div>`:''}</div><div class="chat-message-meta">${m.liked&&!out?'<span class="chat-liked">♥</span>':''}<span>${safe(Number.isFinite(m.createdAt)?stamp(m.createdAt):m.time)}${out?' · sent by Jo jo':''}</span>${out?ci('check'):''}</div></div>${!out?`<div class="chat-inline-actions">${button('message-menu','Message options',ci('dots'),`data-mid="${safe(m.id)}" class="chat-icon-button chat-message-more"`)}${button('like',m.liked?'Unlike message':'Like message',ci('heart'),`data-mid="${safe(m.id)}" aria-pressed="${!!m.liked}" class="chat-icon-button ${m.liked?'is-liked':''}"`)}${button('reply','Reply to message',ci('mail'),`data-mid="${safe(m.id)}"`)}</div>`:''}</article>`}
 function composerMarkup(){return `<button type="button" class="chat-scroll-latest" data-action="chat-latest" aria-label="Scroll to latest message">${icon('chevron')}</button><form class="chat-composer" id="chat-compose-form"><div class="chat-emoji-bar">${emojis.map(e=>`<button type="button" data-action="chat-emoji" data-emoji="${safe(e)}" aria-label="Insert ${safe(e)}">${e}</button>`).join('')}<button type="button" class="chat-emoji-open" data-action="chat-emojis" aria-label="More emojis">${ci('smile')}</button></div><label class="visually-hidden" for="chat-message-text">Type a message</label><textarea class="chat-compose-text" id="chat-message-text" name="text" placeholder="Type a message…" maxlength="3000">${safe(draft)}</textarea><div class="chat-draft-details" id="chat-draft-details">${draftTokens()}</div><div class="chat-quick-chips">${Object.keys(quickReplies).map(key=>`<button type="button" data-action="chat-quick" data-key="${safe(key)}">${key}</button>`).join('')}</div><div class="chat-compose-bottom"><div class="chat-compose-tools">${button('attach','Attach image or file',ci('gallery'))}${button('gif','Insert GIF',ci('gif'))}${button('video','Attach video',ci('video'))}${button('voice','Voice message',ci('mic'))}${button('gallery','Open media vault',icon('media'))}${button('gallery','Add gallery preview',ci('vaultadd'),'class="chat-icon-button chat-tool-special"')}${button('schedule','Schedule message',ci('schedule'))}${button('price','Set PPV price',ci('price'))}${button('mention','Mention subscriber',ci('at'))}<button type="button" class="chat-icon-button chat-text-icon" data-action="chat-format" aria-label="Text formatting">Aa</button></div><button type="button" class="chat-send-mode" data-action="chat-send-mode" aria-label="Message send mode">∴</button><button type="submit" class="chat-send-button">SEND ${ci('clock')}</button></div><input type="file" class="chat-attachment-input" id="chat-file-input" aria-label="Choose local attachment"></form>`}
 function draftTokens(){return `${replyTo?`<span class="chat-draft-token">Reply: ${safe(replyTo.text.slice(0,35))}<button type="button" data-action="chat-clear-reply" aria-label="Cancel reply">×</button></span>`:''}${draftAttachment?`<span class="chat-draft-token">${safe(draftAttachment)}<button type="button" data-action="chat-clear-attachment" aria-label="Remove attachment">×</button></span>`:''}${draftPrice?`<span class="chat-draft-token">PPV ${money(draftPrice)}<button type="button" data-action="chat-clear-price" aria-label="Remove PPV price">×</button></span>`:''}${draftSchedule?`<span class="chat-draft-token">${safe(scheduledLabel(draftSchedule))}<button type="button" data-action="chat-clear-schedule" aria-label="Cancel schedule">×</button></span>`:''}`}
 function syncDraft(){const box=document.getElementById('chat-message-text');if(box)draft=box.value}
 function updateDraft(){const box=document.getElementById('chat-message-text');if(box)box.value=draft;const tokens=document.getElementById('chat-draft-details');if(tokens)tokens.innerHTML=draftTokens()}
 function focusDraft(){document.getElementById('chat-message-text')?.focus({preventScroll:true})}
 function render(options={}){initializeTimestamps();const root=document.getElementById('chat-root');if(!root)return;const oldScroll=root.querySelector('.chat-thread-scroll')?.scrollTop||0,c=current();if(c)selected=c.id;root.classList.toggle('chat-mobile-detail',mobileDetail);root.innerHTML=`<section class="chat-inbox" aria-label="Conversations">${inboxMarkup()}</section><section class="chat-thread" aria-label="${c?'Conversation with '+safe(c.name):'Conversation'}">${c?headerMarkup(c)+`<div class="chat-thread-scroll" id="chat-thread-scroll" aria-live="polite">${c.messages.map(m=>messageMarkup(m,c)).join('')}</div>`+composerMarkup():'<div class="chat-thread-empty">Choose a conversation to start.</div>'}</section>`;root.oninput=input;root.onchange=change;root.onkeydown=keydown;const scroll=root.querySelector('.chat-thread-scroll');if(scroll)scroll.scrollTop=options.bottom?scroll.scrollHeight:options.keepScroll?oldScroll:0;updateFindCounter();if(scroll)scroll.onscroll=()=>{if(scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<=48)markRead(current())};if(options.focus)focusDraft();startSimulation()}
 function renderInbox(){const root=document.getElementById('chat-inbox-list');if(!root)return;const active=document.activeElement,row=active?.closest('.chat-contact'),restore=root.contains(active)?{id:row?.dataset.id,action:active?.dataset.action}:null,top=root.scrollTop;root.innerHTML=filtered().map(contactMarkup).join('')||'<div class="chat-empty">No conversations match this filter.</div>';root.scrollTop=top;if(restore?.id){const replacement=[...root.querySelectorAll('.chat-contact')].find(x=>x.dataset.id===restore.id);const control=restore.action==='chat-select'?replacement:replacement?.querySelector(`[data-action="${restore.action}"]`);control?.focus({preventScroll:true})}}
 function updateFindCounter(){const counter=document.getElementById('chat-find-counter');if(counter){const matches=current()?.messages.filter(m=>findQuery&&m.text.toLowerCase().includes(findQuery.toLowerCase())).length||0;counter.textContent=findQuery?`${matches} matching message${matches===1?'':'s'}`:''}}
 function input(e){if(e.target.id==='chat-message-text')draft=e.target.value;if(e.target.id==='chat-inbox-search'){query=e.target.value;renderInbox()}if(e.target.id==='chat-find-input'){findQuery=e.target.value;const q=findQuery.toLowerCase();document.querySelectorAll('#chat-thread-scroll .chat-message').forEach(row=>{const m=current().messages.find(m=>m.id===row.dataset.messageId);row.classList.toggle('find-match',!!q&&!!m&&m.text.toLowerCase().includes(q))});updateFindCounter()}}
 function change(e){if(e.target.id==='chat-file-input'){const file=e.target.files?.[0];if(file){draftAttachment=file.name;updateDraft();toast('Attachment added to this local demo');focusDraft()}}}
 function keydown(e){if(e.target.id==='chat-message-text'&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();document.getElementById('chat-compose-form')?.requestSubmit()}const row=e.target.closest('.chat-contact');if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();action(row)}}
 const message=id=>current()?.messages.find(m=>m.id===id);
 function draftDialog(kind){syncDraft();if(kind==='price')modal('PPV price',`<form id="chat-price-form"><label class="form-field">Message price (USD)<input name="price" type="number" min="0" max="1000" step="0.01" value="${(draftPrice/100).toFixed(2)}" required></label><div class="dialog-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button type="submit" class="blue-button">APPLY</button></div></form>`);if(kind==='schedule')modal('Schedule message',`<form id="chat-schedule-form"><label class="form-field">Date and time (Berlin)<input name="schedule" type="datetime-local" value="${safe(draftSchedule||berlinInput(Date.now()+3600000))}" required></label><p class="chat-modal-note">Saved as a scheduled message in this local demo.</p><div class="dialog-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button type="submit" class="blue-button">SET SCHEDULE</button></div></form>`)}
 function action(b){const act=b.dataset.action.replace(/^chat-/,''),c=current();switch(act){
 case 'back':location.hash='#/statements/statistics';break;
 case 'thread-back':mobileDetail=false;render();break;
 case 'select':syncDraft();selected=b.dataset.id;markRead(current());mobileDetail=true;findQuery='';replyTo=null;render();break;
 case 'filter':syncDraft();filter=b.dataset.key;render({keepScroll:true});break;
 case 'sort':sortNewest=!sortNewest;render({keepScroll:true});break;
 case 'filter-menu':modal('Conversation filters',`<div class="simple-list">${[['all','All'],['tips','With Tips'],['spenders','B-SPENDERS'],['following','Following']].map(([key,label])=>`<button type="button" data-action="chat-filter-modal" data-key="${key}">${label}${filter===key?' ✓':''}</button>`).join('')}</div>`);break;
 case 'filter-modal':filter=b.dataset.key;closeModal();render({keepScroll:true});break;
 case 'search':syncDraft();searchOpen=!searchOpen;if(!searchOpen)query='';render({keepScroll:true});document.getElementById('chat-inbox-search')?.focus();break;
 case 'find':syncDraft();findOpen=!findOpen;if(!findOpen)findQuery='';render({keepScroll:true});document.getElementById('chat-find-input')?.focus();break;
 case 'latest':{const scroll=document.getElementById('chat-thread-scroll');if(scroll)scroll.scrollTop=scroll.scrollHeight;markRead(current());break}
 case 'star':case 'mute':case 'pin':{if(!c)break;const key={star:'starred',mute:'muted',pin:'pinned'}[act];c[key]=!c[key];persist();syncDraft();if(!document.getElementById('modal').hidden)closeModal();render({keepScroll:true});toast(act==='star'?(c.starred?'Added to favorites':'Removed from favorites'):act==='mute'?(c.muted?'Conversation muted':'Conversation unmuted'):(c.pinned?'Conversation pinned':'Conversation unpinned'));break}
 case 'translate':{const m=message(b.dataset.mid);if(m){m.translated=!m.translated;persist();syncDraft();render({keepScroll:true})}break}
 case 'like':{const m=message(b.dataset.mid);if(m){m.liked=!m.liked;persist();syncDraft();render({keepScroll:true})}break}
 case 'reply':{const m=message(b.dataset.mid);if(m){replyTo={id:m.id,text:m.text};updateDraft();focusDraft()}break}
 case 'message-menu':{const m=message(b.dataset.mid);if(m)modal('Message options',`<p>${safe(m.text)}</p><div class="simple-list"><button type="button" data-action="chat-reply-modal" data-mid="${safe(m.id)}">Reply</button><button type="button" data-action="chat-copy-message" data-mid="${safe(m.id)}">Copy message text</button><button type="button" data-action="chat-like-modal" data-mid="${safe(m.id)}">${m.liked?'Remove like':'Like message'}</button></div>`);break}
 case 'reply-modal':{const m=message(b.dataset.mid);if(m)replyTo={id:m.id,text:m.text};closeModal();updateDraft();focusDraft();break}
 case 'like-modal':{const m=message(b.dataset.mid);if(m){m.liked=!m.liked;persist()}closeModal();render({keepScroll:true});break}
 case 'copy-message':{const m=message(b.dataset.mid);if(m){navigator.clipboard?.writeText(m.text).then(()=>toast('Message text copied')).catch(()=>toast('Select the message text to copy it'))}break}
 case 'emoji':syncDraft();draft+=b.dataset.emoji;updateDraft();focusDraft();break;
 case 'emojis':modal('Choose an emoji',`<div class="chat-emoji-picker">${[...emojis,'💙','✨','🎵','🙌','🌞','🌸','📸','🎬','💬','💫','🌊','🎉','🤍','🫶','🌟','😁','🥳','☕','🌈','🦋','💌','🌹','🍒','😎'].map(e=>`<button type="button" data-action="chat-emoji-modal" data-emoji="${safe(e)}">${e}</button>`).join('')}</div>`);break;
 case 'emoji-modal':syncDraft();draft+=b.dataset.emoji;closeModal();updateDraft();focusDraft();break;
 case 'quick':syncDraft();draft=quickReplies[b.dataset.key]||draft;if(b.dataset.key==='PPV')draftPrice=draftPrice||2500;updateDraft();focusDraft();break;
 case 'price':draftDialog('price');break;
 case 'schedule':draftDialog('schedule');break;
 case 'clear-reply':replyTo=null;updateDraft();break;
 case 'clear-attachment':draftAttachment='';updateDraft();break;
 case 'clear-price':draftPrice=0;updateDraft();break;
 case 'clear-schedule':draftSchedule='';updateDraft();break;
 case 'mention':syncDraft();draft+=(draft&&!draft.endsWith(' ')?' ':'')+'@'+(c?.handle||'subscriber')+' ';updateDraft();focusDraft();break;
 case 'format':syncDraft();modal('Message formatting',`<div class="simple-list"><button type="button" data-action="chat-format-apply" data-key="bold">Bold text</button><button type="button" data-action="chat-format-apply" data-key="italic">Italic text</button><button type="button" data-action="chat-format-apply" data-key="list">Bullet list</button></div>`);break;
 case 'format-apply':draft=b.dataset.key==='bold'?`**${draft||'Your text'}**`:b.dataset.key==='italic'?`_${draft||'Your text'}_`:`• ${draft||'First point'}\n• Second point`;closeModal();updateDraft();focusDraft();break;
 case 'attach':case 'video':{const input=document.getElementById('chat-file-input');if(input){input.accept=act==='video'?'video/*':'image/*,.pdf';input.click()}break}
 case 'gif':modal('Choose a demo GIF',`<div class="chat-gallery-grid">${['Hello 👋','Thank you 💙','Celebration 🎉'].map((name,i)=>`<button type="button" class="chat-gallery-item" data-action="chat-add-gif" data-key="${i}"><span style="font-size:30px">${['👋','💙','🎉'][i]}</span><span>${name}</span></button>`).join('')}</div>`);break;
 case 'add-gif':draftAttachment=['Hello.gif','Thank you.gif','Celebration.gif'][Number(b.dataset.key)];closeModal();updateDraft();focusDraft();break;
 case 'voice':syncDraft();modal('Voice message',`<p>Choose a sample voice-note attachment for this presentation.</p><button type="button" class="blue-button" data-action="chat-add-voice">ADD DEMO VOICE NOTE</button>`);break;
 case 'add-voice':draftAttachment='Voice note · 0:12';closeModal();updateDraft();focusDraft();break;
 case 'gallery':syncDraft();modal('Gallery',`<div class="chat-gallery-grid">${['Studio preview','Weekend update','Behind the scenes','Blue collection','New favourites','Thank-you note'].map((name,i)=>`<button type="button" class="chat-gallery-item" data-action="chat-gallery-item" data-key="${i}">${ci('gallery')}<span>${name}</span></button>`).join('')}</div>`);break;
 case 'gallery-item':{const names=['Studio preview','Weekend update','Behind the scenes','Blue collection','New favourites','Thank-you note'];const label=names[Number(b.dataset.key)]||'Studio preview';modal(label,`<div class="chat-gallery-preview">${ci('gallery')}<span>${safe(label)}</span></div><div class="dialog-actions"><button type="button" class="secondary" data-action="chat-gallery">Back</button><button type="button" class="blue-button" data-action="chat-attach-gallery" data-key="${safe(label)}">ATTACH PREVIEW</button></div>`);break}
 case 'attach-gallery':draftAttachment=b.dataset.key+'.jpg';closeModal();updateDraft();focusDraft();break;
 case 'send-mode':modal('Send mode','<p>Messages are saved only in this browser for the presentation.</p><div class="simple-list"><button type="button" data-action="close">Single recipient ✓</button><button type="button" data-action="chat-price">Set PPV price</button><button type="button" data-action="chat-schedule">Schedule message</button></div>');break;
 case 'new':modal('New conversation',`<form id="chat-new-form"><label class="form-field">Display name<input name="name" required maxlength="50" placeholder="Demo subscriber"></label><label class="form-field">First message<textarea name="message" maxlength="3000" placeholder="Write a friendly welcome…"></textarea></label><div class="dialog-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button class="blue-button" type="submit">CREATE CONVERSATION</button></div></form>`);break;
 case 'rename':if(c)modal('Edit conversation',`<form id="chat-rename-form"><label class="form-field">Display name<input name="name" required maxlength="50" value="${safe(c.name)}"></label><button class="blue-button" type="submit">SAVE NAME</button></form>`);break;
 case 'notes':if(c)modal('Conversation notes',`<form id="chat-notes-form"><label class="form-field">Private demo note<textarea name="notes" maxlength="2000">${safe(c.notes||'')}</textarea></label><button class="blue-button" type="submit">SAVE NOTE</button></form>`);break;
 case 'contact-info':{const person=contacts.find(x=>x.id===b.dataset.id);if(person)modal(person.name,`<p>@${safe(person.handle)}</p><div class="chat-stats-line"><span>Demo spend</span><strong>${money(person.spend)}</strong></div><div class="chat-stats-line"><span>Subscription</span><strong>${safe(person.status)}</strong></div><div class="chat-stats-line"><span>Messages</span><strong>${person.messages.length}</strong></div><p class="chat-modal-note">Fictional subscriber for the internal presentation.</p>`);break}
 case 'inbox-stats':modal('Message statistics',`<div class="chat-stats-line"><span>Demo conversations</span><strong>${contacts.filter(c=>!c.archived).length}</strong></div><div class="chat-stats-line"><span>Messages</span><strong>${contacts.reduce((n,c)=>n+c.messages.length,0)}</strong></div><div class="chat-stats-line"><span>PPV Messages · all time gross</span><strong>${money(sums(DATA.months).categories.messages.gross)}</strong></div><p><a class="text-button" href="#/statements/statistics">Open earning statistics</a></p>`);break;
 case 'archive':{const person=contacts.find(x=>x.id===b.dataset.id);if(person)modal('Archive conversation',`<p>Archive ${safe(person.name)} from this demo inbox?</p><div class="dialog-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button type="button" class="blue-button" data-action="chat-archive-confirm" data-id="${safe(person.id)}">ARCHIVE</button></div>`);break}

 function keydown(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('fans-chart-hit')){e.preventDefault();action(e.target);return}if(e.key==='Escape'){const tip=document.querySelector('.fans-chart-tooltip');if(tip)tip.hidden=true}}
 function pointerMove(e){const hit=e.target.closest('.fans-chart-hit');if(!hit)return;const graph=hit.parentElement,tip=graph.querySelector('.fans-chart-tooltip'),records=groupedDays(),rect=hit.getBoundingClientRect(),idx=Math.max(0,Math.min(records.length-1,Math.round((e.clientX-rect.left)/rect.width*(records.length-1)))),d=records[idx];if(!d)return;const accumulated=chartMode==='growth'?records.slice(0,idx+1).reduce((n,d)=>n+moneyFor(d),0):moneyFor(d);tip.innerHTML=`<strong>${dateLabel(d.date)}</strong><br>${chartMode==='growth'?'Cumulative earnings':'Earnings'}: ${money(accumulated)}<br>${number(countFor(d))} ${segment==='new'?'new subscribers':segment==='renews'?'renews':'subscriptions'}<br>${number(d.active)} active fans`;tip.hidden=false}
 function reset(){primary='fans';section='subscriptions';segment='all';range='last30';from=clamp(end30);to=END;chartMode='growth';selected='mason';detailTab='subscription';spendTab='total';pageIndex=0;query='';mobileAside=false;for(const key of Object.keys(preferences))delete preferences[key];savePreferences()}
 return {render,action,submit,change,keydown,reset,onLeave:()=>{mobileAside=false},getState:()=>({primary,section,segment,range,from,to,chartMode,selected,detailTab,spendTab,pageIndex,query,totals:copy(currentTotals()),topFan:copy(topFan),currentFan:copy(currentFan())})};
})();

$('#current-balance').textContent=money(state.balance);$('#payout-method').value=state.schedule;fitCanvas();renderPage();
</script>
