<script>
'use strict';
const HTML_SOURCE='<!doctype html>\n'+document.documentElement.outerHTML;
const DATA=JSON.parse(document.getElementById('demo-data').textContent);
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const CATEGORIES=[['subscriptions','Subscriptions'],['tips','Tips'],['posts','Posts'],['messages','Messages'],['referrals','Referrals']];
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n/100);
const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem('statements-demo-v2:'+key))??fallback}catch{return fallback}};
const write=(key,value)=>{try{localStorage.setItem('statements-demo-v2:'+key,JSON.stringify(value))}catch{}};
const state={from:'2021-10-02',to:'2026-10-20',year:'all',hidden:new Set(),payouts:read('payouts',[]),posts:read('posts',[]),replies:read('replies',[]),balance:read('balance',1755808),schedule:read('schedule','manual'),privacy:false};
let lastFocus=null,toastTimer=null;
function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function modal(title,html){lastFocus=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;$('#modal').hidden=false;setTimeout(()=>$('.dialog input,.dialog select,.dialog textarea,.dialog .close')?.focus(),0)}
function closeModal(){$('#modal').hidden=true;lastFocus?.focus()}
function selectedMonths(){return DATA.months.filter(m=>m.id>=state.from.slice(0,7)&&m.id<=state.to.slice(0,7)&&(state.year==='all'||m.year===Number(state.year)))}
function sums(months){const cats=Object.fromEntries(CATEGORIES.map(([k])=>[k,{gross:0,net:0}]));let gross=0,net=0;for(const m of months){gross+=m.gross;net+=m.net;for(const [k] of CATEGORIES){cats[k].gross+=m.categories[k].gross;cats[k].net+=m.categories[k].net}}return {categories:cats,gross,net}}
function table(record,options={}){return `<table class="earnings-table" aria-label="${options.month?'Monthly':'All time'} earnings, gross and net">${options.month?'<thead><tr><th>Revenue source</th><th>Gross</th><th>Net</th></tr></thead>':''}<tbody>${CATEGORIES.map(([k,label])=>`<tr data-key="${k}" class="${!options.month&&state.hidden.has(k)?'is-muted':''}"><td><button class="category-button" data-action="${options.month?'transactions':'category'}" data-key="${k}" ${options.id?`data-id="${options.id}"`:''} ${!options.month?`aria-pressed="${!state.hidden.has(k)}"`:''}><span class="dot" style="--dot:var(--${k})"></span>${label}</button></td><td class="money">${money(record.categories[k].gross)}</td><td class="money">${money(record.categories[k].net)}</td></tr>`).join('')}</tbody><tfoot><tr><td>TOTAL</td><td><span class="total-label">GROSS</span><span class="money">${money(record.gross)}</span></td><td><span class="total-label">NET</span><span class="money">${money(record.net)}</span></td></tr></tfoot></table>`}
function chart(){
const records=selectedMonths().slice().reverse();
const max=Math.max(1,...records.map(m=>m.gross));
const x=i=>records.length<2?255:i/(records.length-1)*510;
const y=value=>137-value/max*106;
const points=values=>values.map((value,i)=>`${x(i).toFixed(2)},${y(value).toFixed(2)}`).join(' ');
const curves=CATEGORIES.slice().reverse().map(([k])=>`<polyline class="series" data-series="${k}" style="stroke:var(--${k});${state.hidden.has(k)?'display:none':''}" points="${points(records.map(m=>m.categories[k].gross))}"/>`).join('');
const totalLine=`<polyline class="series total-series" data-series="total" style="stroke:var(--blue);stroke-width:2.1" points="${points(records.map(m=>m.gross))}"/>`;
const labels=Array.from({length:Math.min(5,records.length)},(_,i)=>{const index=Math.round(i*(records.length-1)/Math.max(1,Math.min(5,records.length)-1));const m=records[index];return `<text class="axis-label" x="${x(index)}" y="158" text-anchor="${i===0?'start':i===Math.min(5,records.length)-1?'end':'middle'}">${m.label.replace(', ',' ').replace(/([A-Za-z]{3})[a-z]+/,'$1')}</text>`}).join('');
const ends=records.length?`<text class="axis-label money" x="0" y="${Math.max(31,y(records[0].gross)-10)}" text-anchor="start">${money(records[0].gross)}/mo</text>${records.length>1?`<text class="axis-label money" x="510" y="21" text-anchor="end">${money(records.at(-1).gross)}/mo</text>`:''}`:'';
return `<div class="plot"><svg viewBox="0 0 510 160" preserveAspectRatio="none" role="img" aria-label="Monthly gross revenue, from ${money(records[0]?.gross||0)} to ${money(records.at(-1)?.gross||0)} per month. Category lines show Subscriptions, Tips and PPV Messages."><text class="axis-label" x="0" y="10" style="fill:#969da2">Monthly gross revenue · Total</text><path class="grid" d="M0 31H510M0 66H510M0 101H510M0 137H510"/>${curves}${totalLine}${ends}${labels}</svg><button class="chart-hit" data-action="chart" aria-label="Inspect monthly gross revenue chart"></button><div class="plot-tooltip money" hidden></div></div>`}
function monthMarkup(m){return `<details class="month" data-month="${m.id}"><summary><span>${m.label}</span><strong class="money"><small class="gross-label">GROSS</small>${money(m.gross)}</strong>${icon('chevron','chevron')}</summary><div class="month-body"><div class="month-caption"><span>${m.id==='2026-10'?'October 1–20, 2026':m.label}</span><span>Gross revenue · USD</span></div>${table(m,{month:true,id:m.id})}<div class="detail-actions"><button class="text-button" data-action="daily" data-id="${m.id}" aria-expanded="false">Daily breakdown ${icon('chevron','chevron')}</button><button class="text-button" data-action="export-month" data-id="${m.id}">${icon('download')} CSV</button></div><div class="daily-container" hidden></div></div></details>`}
function dateLabel(s){return new Date(s+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'})}
function renderStatistics(){const records=selectedMonths(),total=sums(records);$('#main-content').innerHTML=`<div class="section-title"><span>EARNING STATISTICS</span><span class="timezone">Date/Time shown in UTC time zone</span></div><section class="overview"><button class="overview-toggle" data-action="overview" aria-expanded="true" aria-controls="overview-body"><span>${state.year==='all'&&state.from==='2021-10-02'&&state.to==='2026-10-20'?'All time':'Selected period'}</span><span class="amount"><small class="gross-label">GROSS</small><span class="money">${money(total.gross)}</span></span>${icon('chevron','chevron')}</button><div id="overview-body">${chart()}<button class="date-pill" data-action="date">${icon('calendar')}<span class="date-prefix">From</span><strong>${dateLabel(state.from)}</strong><span class="date-prefix">To</span><strong>${dateLabel(state.to)}</strong></button>${table(total)}</div></section><div class="months">${records.map(monthMarkup).join('')||'<p class="empty-state">No months in this period.</p>'}</div><div class="history-tools"><label>Year <select id="year-filter"><option value="all">All years</option>${[2026,2025,2024,2023,2022,2021].map(y=>`<option ${state.year==y?'selected':''}>${y}</option>`).join('')}</select></label><span>${records.length} months</span><button class="text-button" data-action="download-html">${icon('download')} HTML</button><button class="text-button" data-action="export">${icon('download')} Export CSV</button></div><p class="demo-footnote">Internal presentation demo. Fictional revenue scenario: $10,000 in the first month, $420,000 in the latest month, $3,600,000 total gross. Net revenue assumes a 20% platform fee. PPV revenue is included in Messages.</p>`}
function heading(title,body){return `<div class="section-title"><span>${title.toUpperCase()}</span><span class="timezone">Internal demo · UTC</span></div><section class="subpage"><h2>${title}</h2>${body}</section>`}
function renderPage(){const route=location.hash.replace(/^#\/?/,'')||'statements/statistics';const inStatements=route.startsWith('statements/');$('#page-title').textContent=inStatements?'STATEMENTS':({home:'HOME',notifications:'NOTIFICATIONS',messages:'MESSAGES',collections:'COLLECTIONS',vault:'VAULT',queue:'QUEUE',statistics:'STATISTICS',profile:'PROFILE'}[route]||'STATEMENTS');$$('.statement-menu a').forEach(a=>{const active=a.hash==='#/'+route;a.classList.toggle('active',active);active?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});$$('a.rail-link').forEach(a=>{const active=a.hash==='#/'+route||(inStatements&&a.hash==='#/statements/statistics');a.classList.toggle('active',active);active?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});$('#scroller').scrollTop=0;
if(route==='statements/statistics'){renderStatistics();return}
let body='';
if(route==='statements/earnings')body=heading('Earnings',`<div class="metric"><span>ALL TIME · GROSS REVENUE</span><strong class="money">${money(sums(DATA.months).gross)}</strong></div><div class="notice">Subscriptions and PPV Messages are shown separately for every month.</div><div class="simple-list">${DATA.months.map(m=>`<a href="#/statements/statistics" data-open-month="${m.id}"><span>${m.label}</span><strong class="money"><small class="gross-label">GROSS</small>${money(m.gross)}</strong></a>`).join('')}</div>`);
else if(route==='statements/payouts')body=heading('Payout requests',`<div class="metric"><span>AVAILABLE BALANCE</span><strong class="money">${money(state.balance)}</strong></div><button class="blue-button" data-action="withdraw">REQUEST WITHDRAWAL</button><div class="simple-list">${state.payouts.length?state.payouts.map(p=>`<button data-action="payout-detail" data-id="${p.id}"><span>${safe(p.date)}<br><small>Demo request · ${safe(p.status)}</small></span><strong class="money">${money(p.amount)}</strong></button>`).join(''):'<p class="empty-state">No payout requests yet.</p>'}</div><p>Requests in this presentation are simulated and saved in this browser.</p>`);
else if(route==='statements/chargebacks')body=heading('Chargebacks','<div class="metric"><span>TOTAL CHARGEBACKS</span><strong class="money">$0.00</strong></div><p class="empty-state">No chargebacks for the selected account.</p><button class="text-button" data-action="chargeback-info">About chargebacks</button>');
else if(route==='statements/referrals')body=heading('Referrals','<div class="metric"><span>REFERRAL EARNINGS</span><strong class="money">$0.00</strong></div><p>Share your demo referral code with your team.</p><label class="form-field">Referral code<input id="referral-code" readonly value="TEAM-DEMO-2026"></label><button class="blue-button" data-action="copy-referral">COPY CODE</button>');
else if(route==='home')body=heading('Home',`<p>Creator dashboard · internal presentation</p><div class="metric"><span>OCTOBER 2026 · GROSS REVENUE</span><strong class="money">${money(DATA.months[0].gross)}</strong></div><div class="simple-list"><a href="#/statements/statistics">Earning statistics ${icon('trend')}</a><a href="#/messages">PPV messages ${icon('message')}</a><a href="#/queue">Scheduled content ${icon('calendar')}</a></div>${state.posts.map(p=>`<div class="conversation"><strong>Demo post</strong><p>${safe(p.text)}</p></div>`).join('')}`);
else if(route==='notifications')body=heading('Notifications','<div class="simple-list"><a href="#/statements/statistics"><span>October statement is available<br><small>Oct 20, 2026 · 09:00 UTC</small></span>'+icon('chevron','chevron')+'</a><a href="#/statements/payouts">Review your payout requests '+icon('chevron','chevron')+'</a></div>');
else if(route==='messages')body=heading('Messages',`<div class="notice">PPV Messages · demo conversations. Messages entered here remain local to this browser.</div><div class="content-tabs"><button class="active" data-action="message-tab" data-tab="all">All</button><button data-action="message-tab" data-tab="ppv">PPV</button></div><div id="conversations">${messagesMarkup('all')}</div><p><button class="blue-button" data-action="compose">NEW MESSAGE</button></p>`);
else if(route==='collections')body=heading('Collections','<div class="simple-list"><button data-action="collection" data-key="Subscribers">Subscribers <span>Subscription revenue</span></button><button data-action="collection" data-key="PPV buyers">PPV buyers <span>Message revenue</span></button><button data-action="collection" data-key="Favorites">Favorites <span>5 demo members</span></button></div>');
else if(route==='vault')body=heading('Vault','<div class="notice">Demo media library</div><div class="simple-list"><button data-action="media" data-key="Presentation assets">Presentation assets <span>3 items</span></button><button data-action="media" data-key="PPV content">PPV content <span>2 items</span></button></div>');
else if(route==='queue')body=heading('Queue',`<div class="notice">Scheduled content · all dates in UTC.</div><div class="conversation"><strong>Oct 21, 2026 · 18:00</strong><p>Weekly subscriber update</p></div>${state.posts.filter(p=>p.schedule).map(p=>`<div class="conversation"><strong>${safe(p.schedule)}</strong><p>${safe(p.text)}</p></div>`).join('')}<p><button class="blue-button" data-action="create">SCHEDULE POST</button></p>`);
else if(route==='statistics')body=heading('Statistics',`<div class="metric"><span>SUBSCRIPTIONS · ALL TIME NET</span><strong class="money">${money(sums(DATA.months).categories.subscriptions.net)}</strong></div><div class="metric"><span>PPV MESSAGES · ALL TIME NET</span><strong class="money">${money(sums(DATA.months).categories.messages.net)}</strong></div><a class="text-button" href="#/statements/statistics">View all monthly statements ${icon('trend')}</a>`);
else if(route==='profile')body=heading('Profile','<p>Presentation account</p><form id="profile-form"><label class="form-field">Display name<input name="displayName" maxlength="60" required></label><label class="form-field">Bio<textarea name="bio" maxlength="300"></textarea></label><button class="blue-button" type="submit">SAVE PROFILE</button></form>');
else {location.hash='#/statements/statistics';return}
$('#main-content').innerHTML=body;if(route==='profile'){const profile=read('profile',{displayName:'Demo Creator',bio:'Internal design presentation.'});$('#profile-form [name=displayName]').value=profile.displayName;$('#profile-form [name=bio]').value=profile.bio}}
function messagesMarkup(tab){return `<div class="conversation"><strong>Alex · PPV message</strong><p>Unlocked content · $25.00</p></div><div class="conversation"><strong>Sam · PPV message</strong><p>Unlocked content · $15.00</p></div>${tab==='all'?'<div class="conversation"><strong>Jordan · Subscriber</strong><p>Thanks for the update!</p></div>':''}${state.replies.filter(p=>tab==='all'||p.price>0).map(p=>`<div class="conversation"><strong>${safe(p.to)} · ${p.price>0?'PPV message':'Message'}</strong><p>${safe(p.text)}${p.price>0?' · '+money(p.price):''}</p><small>Saved locally for this demo</small></div>`).join('')}`}
function downloadCsv(records,name){const header='Demo data (fictional breakdown);Month;Revenue source;Gross USD;Net USD\r\n';const rows=records.flatMap(m=>CATEGORIES.map(([k,l])=>`Internal presentation;${m.label};${l};${(m.categories[k].gross/100).toFixed(2)};${(m.categories[k].net/100).toFixed(2)}`));const blob=new Blob(['\uFEFF'+header+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV exported')}
function dailyRecords(m){const count=m.id==='2026-10'?20:new Date(Date.UTC(m.year,m.month,0)).getUTCDate();const first=m.id==='2021-10'?2:1;const weights=Array.from({length:count-first+1},(_,i)=>1+((i*7+m.month*3)%11)/10);const split=n=>{const sum=weights.reduce((a,b)=>a+b,0);const out=weights.map(w=>Math.floor(n*w/sum));let remain=n-out.reduce((a,b)=>a+b,0);for(let i=0;i<remain;i++)out[i%out.length]++;return out};const cats=Object.fromEntries(CATEGORIES.map(([k])=>[k,split(m.categories[k].net)]));return weights.map((_,i)=>({day:i+first,subs:cats.subscriptions[i],ppv:cats.messages[i],tips:cats.tips[i],total:CATEGORIES.reduce((s,[k])=>s+cats[k][i],0)}))}
function dailyMarkup(m){return `<table class="daily-table"><thead><tr><th>Date (UTC)</th><th>Subs net</th><th>PPV net</th><th>Tips net</th><th>Total net</th></tr></thead><tbody>${dailyRecords(m).map(d=>`<tr><td>${m.id}-${String(d.day).padStart(2,'0')}</td><td class="money">${money(d.subs)}</td><td class="money">${money(d.ppv)}</td><td class="money">${money(d.tips)}</td><td class="money">${money(d.total)}</td></tr>`).join('')}</tbody></table>`}
function openDates(){modal('Date range',`<p>The selected date range includes complete calendar months. October 2021 starts on the 2nd; October 2026 ends on the 20th.</p><form id="dates-form"><label class="form-field">From<input name="from" type="date" min="2021-10-02" max="2026-10-20" value="${state.from}" required></label><label class="form-field">To<input name="to" type="date" min="2021-10-02" max="2026-10-20" value="${state.to}" required></label><div class="date-shortcuts"><button type="button" data-action="date-preset" data-key="all">All time</button><button type="button" data-action="date-preset" data-key="2026">2026</button><button type="button" data-action="date-preset" data-key="2025">2025</button><button type="button" data-action="date-preset" data-key="month">October 2026</button></div><p class="form-error" id="date-error" hidden></p><div class="dialog-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button class="blue-button" type="submit">APPLY</button></div></form>`)}
const actions={
help:()=>modal('Internal presentation demo','<p>This is a local interactive design demo based on the supplied screenshot. Roboto, icons, chart and data are embedded in this HTML file.</p><p>Revenue scenario: $10,000 gross in the first month, $420,000 gross in the latest month and $3,600,000 total gross. Net is shown after a 20% platform fee. Monthly and daily breakdowns, unseen pages and the profile illustration are demo content. PPV revenues appear under Messages.</p><p>No real payments or messages are sent. Demo changes are stored in this browser.</p><button class="text-button" data-action="sitemap">Open sitemap</button>'),
rank:()=>modal('Creator ranking','<div class="metric"><span>CREATOR RANKING</span><strong>Top 4.6%</strong></div><p>Ranking reproduced from the reference screenshot for the team presentation.</p>'),
pending:()=>modal('Pending balance','<div class="metric"><span>PENDING BALANCE</span><strong class="money">$677.60</strong></div><p>Pending earnings are waiting to become available for payout. This amount is part of the screenshot demo.</p>'),
balance:b=>{const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!open);$('#balance-body').hidden=open},
overview:b=>{const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!open);$('#overview-body').hidden=open},
category:b=>{const k=b.dataset.key;state.hidden.has(k)?state.hidden.delete(k):state.hidden.add(k);const hidden=state.hidden.has(k);b.setAttribute('aria-pressed',!hidden);b.closest('tr').classList.toggle('is-muted',hidden);$(`[data-series="${k}"]`).style.display=hidden?'none':''},
chart:()=>modal('Monthly gross revenue',`<p>The blue total line shows gross revenue in each calendar month. Category lines break it down into Subscriptions, PPV Messages and Tips.</p><div class="metric"><span>FIRST MONTH · GROSS</span><strong class="money">${money(selectedMonths().at(-1)?.gross||0)}</strong></div><div class="metric"><span>LATEST MONTH · GROSS</span><strong class="money">${money(selectedMonths()[0]?.gross||0)}</strong></div>${table(sums(selectedMonths()))}<p>All values are fictional presentation data. Net reflects a 20% platform fee.</p>`),
date:openDates,
'date-preset':b=>{const key=b.dataset.key;const dates=key==='all'?['2021-10-02','2026-10-20']:key==='month'?['2026-10-01','2026-10-20']:[key+'-01-01',key==='2026'?'2026-10-20':key+'-12-31'];$('#dates-form [name=from]').value=dates[0];$('#dates-form [name=to]').value=dates[1]},
daily:b=>{const m=DATA.months.find(m=>m.id===b.dataset.id),container=b.closest('.month-body').querySelector('.daily-container');if(!container.innerHTML)container.innerHTML=dailyMarkup(m);container.hidden=!container.hidden;b.setAttribute('aria-expanded',!container.hidden)},
transactions:b=>{const m=DATA.months.find(m=>m.id===b.dataset.id),k=b.dataset.key,label=CATEGORIES.find(c=>c[0]===k)[1];modal(label==='Messages'?'PPV Messages':label,`<p>${m.label} · fictional monthly breakdown</p><div class="metric"><span>GROSS</span><strong class="money">${money(m.categories[k].gross)}</strong></div><div class="metric"><span>NET</span><strong class="money">${money(m.categories[k].net)}</strong></div><p>${k==='messages'?'PPV message revenue is included in this category.':k==='subscriptions'?'Subscription revenue for this calendar month.':'Revenue category for this calendar month.'}</p>`)},
export:()=>downloadCsv(selectedMonths(),'statements-demo.csv'),
'download-html':()=>{const blob=new Blob([HTML_SOURCE],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Statements Demo.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('HTML file downloaded')},
'export-month':b=>downloadCsv([DATA.months.find(m=>m.id===b.dataset.id)],'statement-'+b.dataset.id+'-demo.csv'),
withdraw:()=>modal('Request withdrawal',`<div class="notice">Simulated withdrawal for the internal demo.</div><form id="withdraw-form"><label class="form-field">Amount (USD)<input name="amount" type="number" min="20" max="${state.balance/100}" step="0.01" value="${(state.balance/100).toFixed(2)}" required></label><p>Available balance: <strong class="money">${money(state.balance)}</strong></p><div class="dialog-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button class="blue-button" type="submit">REQUEST DEMO PAYOUT</button></div></form>`),
'payout-detail':b=>{const p=state.payouts.find(p=>p.id===b.dataset.id);modal('Demo payout request',`<p>${safe(p.id)} · ${safe(p.date)}</p><div class="metric"><span>${safe(p.status).toUpperCase()}</span><strong class="money">${money(p.amount)}</strong></div><p>This request is stored locally and does not initiate a real payment.</p>`)},
'chargeback-info':()=>modal('Chargebacks','<p>A chargeback is a payment reversed by the cardholder’s bank. This demo account has no chargebacks.</p>'),
spenders:()=>{const list=$('#spender-list');list.hidden=!list.hidden;$('.spender-title').setAttribute('aria-expanded',!list.hidden);if(!list.hidden)list.innerHTML=['Alex','Sam','Jordan','Taylor','Casey'].map((n,i)=>`<button class="spender-person" data-action="person" data-key="${n}"><span class="person-avatar">${n[0]}</span><span>${n}</span><span class="online-dot" aria-label="Online"></span></button>`).join('')},
refresh:b=>{b.classList.remove('rotation');void b.offsetWidth;b.classList.add('rotation');toast('Updated · 5 demo spenders online')},
activity:()=>modal('Activity','<div class="conversation"><strong>Oct 20, 2026 · 09:00 UTC</strong><p>October statement updated.</p></div><div class="conversation"><strong>Oct 20, 2026 · 08:45 UTC</strong><p>5 demo spenders online.</p></div>'),
person:b=>modal(b.dataset.key,`<p>Online · demo account</p><button class="blue-button" data-action="compose" data-key="${safe(b.dataset.key)}">NEW DEMO MESSAGE</button>`),
privacy:b=>{state.privacy=!state.privacy;$('#app').classList.toggle('privacy',state.privacy);b.setAttribute('aria-pressed',state.privacy);toast(state.privacy?'Amounts hidden. Hover to reveal.':'Amounts visible')},
settings:()=>modal('Demo settings',`<p>Self-contained HTML · English (US) · USD · UTC</p><div class="simple-list"><button data-action="sitemap">View sitemap ${icon('chevron','chevron')}</button><button data-action="export">Export selected statements ${icon('download')}</button><button data-action="download-html">Download HTML file ${icon('download')}</button><button data-action="reset">Reset local demo changes ${icon('refresh')}</button></div><p>For the screenshot layout, use a browser viewport of 1294 × 724 at 100% zoom.</p>`),
support:()=>modal('Demo support','<p>Presentation controls</p><p>Open a month to see Subscriptions, Tips and PPV Messages. Use Daily breakdown for daily amounts, or CSV for the selected month.</p><p>The eye icon hides balances. Settings contains the sitemap and the reset action.</p>'),
more:()=>modal('More','<nav><a href="#/profile">Profile</a><a href="#/statements/statistics">Statements</a><a href="#/messages">Messages</a></nav><p><button class="text-button" data-action="settings">Settings</button></p><p><button class="text-button" data-action="sitemap">Sitemap</button></p><p><button class="text-button" data-action="download-html">Download HTML file</button></p>'),
sitemap:()=>modal('Sitemap',`<nav>${[['home','Home'],['notifications','Notifications'],['messages','Messages'],['collections','Collections'],['vault','Vault'],['queue','Queue'],['statements/earnings','Statements / Earnings'],['statements/payouts','Statements / Payout requests'],['statements/statistics','Statements / Earning statistics'],['statements/chargebacks','Statements / Chargebacks'],['statements/referrals','Statements / Referrals'],['statistics','Statistics'],['profile','Profile']].map(([r,t])=>`<a href="#/${r}">${t}</a>`).join('')}</nav>`),
create:()=>modal('New demo post',`<form id="post-form"><div class="notice">Saved only in this demo.</div><label class="form-field">Post<textarea name="text" required maxlength="1500" placeholder="Write your update…"></textarea></label><label class="form-field">Schedule (optional, UTC)<input name="schedule" type="datetime-local" min="2026-10-20T00:00"></label><div class="dialog-actions"><button class="secondary" type="button" data-action="close">Cancel</button><button class="blue-button" type="submit">SAVE DEMO POST</button></div></form>`),
compose:b=>modal('New demo message',`<form id="message-form"><div class="notice">Saved locally. No message is sent.</div><label class="form-field">To<select name="to">${['Alex','Sam','Jordan','Taylor','Casey'].map(n=>`<option ${n===b.dataset.key?'selected':''}>${n}</option>`).join('')}</select></label><label class="form-field">Message<textarea name="text" required maxlength="1500"></textarea></label><label class="form-field">PPV price (USD, 0 for a free message)<input name="price" type="number" min="0" max="1000" step="0.01" value="25.00" required></label><div class="dialog-actions"><button class="secondary" type="button" data-action="close">Cancel</button><button class="blue-button" type="submit">SAVE DEMO MESSAGE</button></div></form>`),
'message-tab':b=>{$$('.content-tabs button').forEach(x=>x.classList.toggle('active',x===b));$('#conversations').innerHTML=messagesMarkup(b.dataset.tab)},
collection:b=>modal(b.dataset.key,`<p>Presentation collection</p><div class="simple-list">${['Alex','Sam','Jordan','Taylor','Casey'].map(n=>`<button data-action="person" data-key="${n}">${n} ${icon('chevron','chevron')}</button>`).join('')}</div>`),
media:b=>modal(b.dataset.key,`<p>Demo media assets</p><div class="simple-list"><button data-action="asset" data-key="Subscriber update">Subscriber update · Image</button><button data-action="asset" data-key="PPV preview">PPV preview · Video</button></div>`),
asset:b=>modal(b.dataset.key,`<div style="background:#eaf5fd;border-radius:6px;padding:55px 20px;text-align:center;color:#4aafe1">${icon('media')}<p>${safe(b.dataset.key)}</p></div><p>Illustrative media entry for the presentation.</p>`),
'copy-referral':async()=>{try{await navigator.clipboard.writeText('TEAM-DEMO-2026');toast('Referral code copied')}catch{$('#referral-code').select();toast('Referral code selected. Press Ctrl/Cmd+C to copy.')}},
reset:()=>modal('Reset demo','<p>Reset the profile, posts, messages, payout requests and payout schedule saved in this browser?</p><div class="dialog-actions"><button class="secondary" data-action="close">Cancel</button><button class="blue-button" data-action="confirm-reset">RESET DEMO</button></div>'),
'confirm-reset':()=>{['profile','posts','replies','payouts','balance','schedule'].forEach(k=>{try{localStorage.removeItem('statements-demo-v2:'+k)}catch{}});state.posts=[];state.replies=[];state.payouts=[];state.balance=1755808;state.schedule='manual';state.from='2021-10-02';state.to='2026-10-20';state.year='all';state.hidden.clear();state.privacy=false;$('#app').classList.remove('privacy');$('#current-balance').textContent=money(state.balance);$('#payout-method').value='manual';closeModal();renderPage();toast('Demo reset')},
back:()=>{if(location.hash&&location.hash!=='#/statements/statistics'){location.hash='#/statements/statistics'}else{location.hash='#/home'}},
close:closeModal
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){const action=actions[b.dataset.action];if(action)action(b)}const a=e.target.closest('a[href^="#/"]');if(a){closeModal();if(a.dataset.openMonth){state.from='2021-10-02';state.to='2026-10-20';state.year='all';const id=a.dataset.openMonth;setTimeout(()=>{if(!$('.month[data-month="'+id+'"]'))renderStatistics();const d=$('.month[data-month="'+id+'"]');if(d){d.open=true;d.scrollIntoView({block:'start'})}},40)}}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
document.addEventListener('keydown',e=>{if($('#modal').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const elements=$$('button,input,select,textarea,a[href]',$('.dialog')).filter(x=>!x.disabled&&x.offsetParent!==null),first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
document.addEventListener('change',e=>{if(e.target.id==='year-filter'){state.year=e.target.value;renderStatistics()}if(e.target.id==='payout-method'){state.schedule=e.target.value;write('schedule',state.schedule);toast('Demo payout schedule saved')}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f);
if(f.id==='dates-form'){const from=d.get('from'),to=d.get('to');if(from>to||from<'2021-10-02'||to>'2026-10-20'){$('#date-error').textContent='Choose a valid range between Oct 2, 2021 and Oct 20, 2026.';$('#date-error').hidden=false;return}state.from=from;state.to=to;state.year='all';closeModal();renderStatistics()}
if(f.id==='withdraw-form'){const amount=Math.round(Number(d.get('amount'))*100);if(amount<2000||amount>state.balance||!Number.isFinite(amount))return;state.balance-=amount;state.payouts.unshift({id:'DEMO-'+Date.now(),date:'Oct 20, 2026',amount,status:'Pending'});write('balance',state.balance);write('payouts',state.payouts);$('#current-balance').textContent=money(state.balance);closeModal();location.hash='#/statements/payouts';renderPage();toast('Demo payout request saved')}
if(f.id==='profile-form'){write('profile',{displayName:String(d.get('displayName')).trim(),bio:String(d.get('bio'))});toast('Profile saved locally')}
if(f.id==='post-form'){state.posts.unshift({text:String(d.get('text')),schedule:String(d.get('schedule'))});write('posts',state.posts);closeModal();location.hash=d.get('schedule')?'#/queue':'#/home';renderPage();toast('Demo post saved')}
if(f.id==='message-form'){state.replies.push({to:String(d.get('to')),text:String(d.get('text')),price:Math.round(Number(d.get('price'))*100)});write('replies',state.replies);closeModal();location.hash='#/messages';renderPage();toast('Demo message saved locally')}
});
document.addEventListener('pointermove',e=>{const hit=e.target.closest('.chart-hit');if(!hit)return;const records=selectedMonths().slice().reverse();if(!records.length)return;const r=hit.getBoundingClientRect(),ratio=Math.min(.999,Math.max(0,(e.clientX-r.left)/r.width)),index=Math.round(ratio*(records.length-1)),m=records[index],tip=hit.parentElement.querySelector('.plot-tooltip');tip.innerHTML=`<strong>${m.label}</strong><br>Monthly gross: ${money(m.gross)}<br>Subs: ${money(m.categories.subscriptions.gross)}<br>PPV Messages: ${money(m.categories.messages.gross)}<br>Monthly net: ${money(m.net)}`;tip.hidden=false});
document.addEventListener('pointerout',e=>{if(e.target.matches?.('.chart-hit'))e.target.parentElement.querySelector('.plot-tooltip').hidden=true});
window.addEventListener('hashchange',renderPage);
$('#current-balance').textContent=money(state.balance);$('#payout-method').value=state.schedule;renderPage();
</script>
</body>
